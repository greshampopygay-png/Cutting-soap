<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Soap Cutting</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{
  /* Use dvh so mobile browser chrome is excluded */
  min-height:100dvh;
  width:100%;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  cursor:none;
  font-family:-apple-system,'Segoe UI',sans-serif;
  font-weight:700;
  background:#c8b49a;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#f0e2cc 0%,#d8c5a0 60%,#b89a70 100%);
  z-index:0;
}

#hud{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;gap:10px;padding:12px 16px;
}
.pill{
  background:rgba(255,255,255,.92);border-radius:50px;
  padding:8px 18px;font-size:1rem;color:#333;
  box-shadow:0 3px 10px rgba(0,0,0,.15);white-space:nowrap;
}
#bar-wrap{flex:1;height:16px;background:rgba(0,0,0,.18);border-radius:10px;overflow:hidden;}
#bar{height:100%;border-radius:10px;width:100%;
  background:linear-gradient(90deg,#e65c00,#f9a825);transition:width .12s;}

/* Canvas is positioned absolute inside #stage which fills screen below HUD */
#stage{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  z-index:10;
}
#gameCanvas{
  position:absolute;
  top:0;left:0;
  display:block;
}

#knife-wrap{
  position:fixed;z-index:9999;pointer-events:none;display:none;
  width:190px;height:42px;
}

.ck{
  position:fixed;pointer-events:none;z-index:500;
  animation:ckfly var(--t) ease-out forwards;
}
@keyframes ckfly{
  0%{opacity:1;transform:translate(0,0)rotate(0)scale(1);}
  100%{opacity:0;transform:translate(var(--x),var(--y))rotate(var(--r))scale(.05);}
}

.spt{
  position:fixed;z-index:600;pointer-events:none;font-size:1.4rem;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
  animation:sptA .8s ease-out forwards;
}
@keyframes sptA{
  0%{opacity:1;transform:translateY(0)scale(1);}
  100%{opacity:0;transform:translateY(-60px)scale(1.2);}
}

#win{
  display:none;position:fixed;inset:0;z-index:700;
  background:rgba(0,0,0,.65);
  align-items:center;justify-content:center;
}
#win.on{display:flex;}
.wcard{
  background:linear-gradient(135deg,#fffaf4,#ffe8c4);
  border-radius:32px;padding:40px 48px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
  animation:cpop .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cpop{from{transform:scale(.3)rotate(-12deg);}to{transform:scale(1)rotate(0);}}
#wemoji{font-size:6rem;display:block;margin-bottom:10px;
  animation:eb .6s .15s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes eb{from{transform:scale(0);}to{transform:scale(1);}}
.wh{font-size:1.8rem;color:#333;margin-bottom:5px;}
.ws{color:#999;font-size:.9rem;margin-bottom:24px;}
.btn{
  background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;border:none;
  border-radius:50px;padding:14px 44px;font-family:inherit;font-weight:700;
  font-size:1.1rem;cursor:pointer;box-shadow:0 8px 28px rgba(230,92,0,.45);
  transition:transform .12s;
}
.btn:active{transform:scale(.94);}

#ad{
  display:none;position:fixed;inset:0;z-index:800;
  background:#0f172a;align-items:center;justify-content:center;
}
#ad.on{display:flex;}
.abox{
  background:#1e293b;border:1px solid rgba(255,255,255,.1);
  border-radius:28px;padding:44px;text-align:center;width:min(340px,88%);
}
.aico{font-size:4rem;display:block;margin-bottom:12px;}
.ah{font-size:1.6rem;color:#fff;margin-bottom:6px;}
.ap{color:rgba(255,255,255,.45);font-size:.9rem;margin-bottom:22px;}
#adn{font-size:3rem;color:#f9a825;margin-bottom:18px;}
#adbtn{
  background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;border:none;
  border-radius:50px;padding:14px 38px;font-family:inherit;font-weight:700;
  font-size:1.1rem;cursor:pointer;opacity:.3;pointer-events:none;
  transition:opacity .3s,box-shadow .3s;
}
#adbtn.on{opacity:1;pointer-events:all;box-shadow:0 8px 28px rgba(230,92,0,.5);}

#hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  color:rgba(0,0,0,.28);font-size:.85rem;
  pointer-events:none;white-space:nowrap;z-index:50;
}
</style>
</head>
<body>

<div id="hud">
  <div class="pill">LVL <span id="hlvl">1</span></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div class="pill">⭐ <span id="hscore">0</span></div>
</div>

<div id="stage">
  <canvas id="gameCanvas"></canvas>
</div>

<div id="knife-wrap">
  <svg viewBox="0 0 190 42" fill="none" xmlns="http://www.w3.org/2000/svg" width="190" height="42">
    <path d="M28 26 L170 10 L180 17 L170 26Z" fill="url(#bl)"/>
    <path d="M28 26 L170 10" stroke="rgba(255,255,255,.9)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M170 10 L182 14 L170 26Z" fill="#b0c0cc"/>
    <rect x="18" y="20" width="14" height="12" rx="3" fill="#5a6068"/>
    <rect x="2" y="21" width="24" height="10" rx="4" fill="url(#hl)"/>
    <circle cx="9"  cy="26" r="2" fill="#c8a060"/>
    <circle cx="18" cy="26" r="2" fill="#c8a060"/>
    <defs>
      <linearGradient id="bl" x1="28" y1="18" x2="180" y2="18" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#c0ccd8"/>
        <stop offset="45%"  stop-color="#edf4f8"/>
        <stop offset="100%" stop-color="#d0dce8"/>
      </linearGradient>
      <linearGradient id="hl" x1="2" y1="21" x2="2" y2="31" gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#8b5e3c"/>
        <stop offset="100%" stop-color="#4a2e14"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<div id="win">
  <div class="wcard">
    <span id="wemoji">🌟</span>
    <div class="wh" id="wh">Находка!</div>
    <div class="ws" id="ws">Внутри мыла</div>
    <button class="btn" onclick="doNextLevel()">Следующий →</button>
  </div>
</div>

<div id="ad">
  <div class="abox">
    <span class="aico">📺</span>
    <div class="ah">Реклама</div>
    <div class="ap">Посмотри и продолжи игру!</div>
    <div id="adn">5</div>
    <button id="adbtn" onclick="skipAd()">Продолжить →</button>
  </div>
</div>

<div id="hint">Веди ножом по мылу ↔</div>

<script>
// ─── AUDIO ───────────────────────────────────
let AC = null;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function playScrape() {
  if (!AC) return;
  try {
    const dur = 0.06 + Math.random()*0.04, sr = AC.sampleRate;
    const buf = AC.createBuffer(1, Math.floor(sr*dur), sr);
    const d = buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(i/d.length*Math.PI)*0.5;
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=800+Math.random()*500; f.Q.value=1.5;
    const g=AC.createGain(); g.gain.value=0.28;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(); src.stop(AC.currentTime+dur);
  } catch(e){}
}
function playPop() {
  if (!AC) return;
  try {
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(300,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.2);
    g.gain.setValueAtTime(0.4,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.25);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.3);
  } catch(e){}
}
function playTring() {
  if (!AC) return;
  try {
    const t=AC.currentTime;
    [[1047,0],[1319,0.04],[1568,0.08]].forEach(([freq,delay])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,t+delay);
      g.gain.linearRampToValueAtTime(0.35,t+delay+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+delay+1.2);
      o.connect(g); g.connect(AC.destination);
      o.start(t+delay); o.stop(t+delay+1.3);
    });
    const o2=AC.createOscillator(), g2=AC.createGain();
    o2.type='triangle'; o2.frequency.value=2093;
    g2.gain.setValueAtTime(0.14,t);
    g2.gain.exponentialRampToValueAtTime(0.001,t+0.9);
    o2.connect(g2); g2.connect(AC.destination);
    o2.start(t); o2.stop(t+1.0);
  } catch(e){}
}

// ─── THEMES & DATA ───────────────────────────
const THEMES = [
  {top:'#f5ddb0',topH:'#fcefd8',side:'#c87848',sideD:'#a05c30',sideR:'#d89060',name:'Персиковое'},
  {top:'#b0d8f5',topH:'#d8f0ff',side:'#3a70c0',sideD:'#2a5098',sideR:'#5090d8',name:'Синее'},
  {top:'#b8f0b0',topH:'#d8ffd0',side:'#38a050',sideD:'#287838',sideR:'#58c068',name:'Мятное'},
  {top:'#f5b0c8',topH:'#ffd8e8',side:'#c03870',sideD:'#982858',sideR:'#d85888',name:'Розовое'},
  {top:'#c8b0f5',topH:'#e8d8ff',side:'#7040c0',sideD:'#502898',sideR:'#9060d8',name:'Лавандовое'},
];
const REWARDS = ['😊','🌟','🦋','🌈','🦄','💎','🐉','🌙','🍀','🔮','👑','🎭','🐬','🦊','🐱','🌺'];
const TOTAL_LAYERS = 8;

// ─── CANVAS & GEOMETRY ───────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
let VW,VH, CX,SOAP_BOT, SW,SH_UNIT,DEPTH_X,DEPTH_Y,FULL_H;

function setupSize() {
  // Use the actual rendered size of #stage
  const stage = document.getElementById('stage');
  VW = stage.clientWidth  || window.innerWidth;
  VH = stage.clientHeight || window.innerHeight;

  canvas.width  = VW;
  canvas.height = VH;

  CX = VW / 2;

  // Soap width
  SW = Math.min(VW * 0.66, 290);

  // Depth offsets for pseudo-3D
  DEPTH_X =  SW * 0.22;
  DEPTH_Y = -SW * 0.12;

  // Layer height: fill about 55% of screen height with all 8 layers
  SH_UNIT = Math.max(22, Math.floor(VH * 0.55 / TOTAL_LAYERS));
  FULL_H  = TOTAL_LAYERS * SH_UNIT;

  // SOAP_BOT = y of bottom edge of front face
  // Put soap so it's nicely centered vertically in usable area
  // Usable = VH minus HUD(~60px) minus hint(~50px)
  const HUD_H  = 60;
  const HINT_H = 50;
  const usable = VH - HUD_H - HINT_H;
  // Center of soap block vertically in usable area
  const soapCenterY = HUD_H + usable * 0.52;
  SOAP_BOT = soapCenterY + FULL_H / 2;

  // Safety: make sure bottom is on screen
  SOAP_BOT = Math.min(SOAP_BOT, VH - HINT_H - 10);
}

// ─── GAME STATE ───────────────────────────────
let level=1, score=0;
let theme, reward;
let layersDone=0, slicePct=0;
let canCut=true, active=false, lastX=0, sndTick=0;
const knifeWrap = document.getElementById('knife-wrap');

// ─── DRAW ─────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,VW,VH);

  const remaining = TOTAL_LAYERS - layersDone;
  if (remaining <= 0) return;

  const mainH = remaining * SH_UNIT - slicePct * SH_UNIT;
  const slabH = slicePct * SH_UNIT;

  // Front face corners
  const fL = CX - SW/2;
  const fR = CX + SW/2;
  const fB = SOAP_BOT;          // always fixed bottom
  const fT = fB - mainH;        // top shrinks as layers cut

  // Ground shadow
  {
    const gx = CX + DEPTH_X*0.4, gy = fB+18;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.scale(1, 0.35);
    const sg = ctx.createRadialGradient(0,0,4,0,0,SW*0.55);
    sg.addColorStop(0,'rgba(0,0,0,0.22)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(0,0,SW*0.55,0,Math.PI*2);
    ctx.fillStyle=sg; ctx.fill();
    ctx.restore();
  }

  // RIGHT side face
  drawFace([
    [fR,        fB],
    [fR+DEPTH_X,fB+DEPTH_Y],
    [fR+DEPTH_X,fT+DEPTH_Y],
    [fR,        fT],
  ], ctx=>{
    const rg = ctx.createLinearGradient(fR,fT,fR+DEPTH_X,fT+DEPTH_Y);
    rg.addColorStop(0,theme.sideR); rg.addColorStop(1,theme.sideD);
    ctx.fillStyle=rg; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.07)'; ctx.lineWidth=1; ctx.stroke();
    // Layer lines on right face
    for(let l=1;l<remaining;l++){
      const ly=fB-l*SH_UNIT; if(ly<fT) continue;
      ctx.beginPath();
      ctx.moveTo(fR,ly); ctx.lineTo(fR+DEPTH_X,ly+DEPTH_Y);
      ctx.strokeStyle='rgba(0,0,0,0.13)'; ctx.lineWidth=1.2; ctx.stroke();
    }
  });

  // TOP face
  drawFace([
    [fL,        fT],
    [fR,        fT],
    [fR+DEPTH_X,fT+DEPTH_Y],
    [fL+DEPTH_X,fT+DEPTH_Y],
  ], ctx=>{
    const tg = ctx.createLinearGradient(fL,fT,fR+DEPTH_X,fT+DEPTH_Y);
    tg.addColorStop(0,theme.topH); tg.addColorStop(0.5,theme.top); tg.addColorStop(1,theme.topH);
    ctx.fillStyle=tg; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.06)'; ctx.lineWidth=1; ctx.stroke();
    // Shine
    const scx=fL+(fR-fL)*0.3+DEPTH_X*0.3, scy=fT+DEPTH_Y*0.4;
    const sg=ctx.createRadialGradient(scx,scy,2,scx,scy,SW*0.4);
    sg.addColorStop(0,'rgba(255,255,255,.6)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg; ctx.fill();
    // Emoji reveal
    if(layersDone>0){
      const pct=layersDone/TOTAL_LAYERS;
      const ecx=CX+DEPTH_X*0.35, ecy=fT+DEPTH_Y*0.45;
      ctx.globalAlpha=Math.min(1,pct*2.5);
      ctx.font=`${Math.round(10+pct*38)}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(reward,ecx,ecy);
      ctx.globalAlpha=1;
    }
  });

  // FRONT face
  {
    const R = Math.min(18, SW*0.065, mainH*0.3);
    ctx.save();
    rr(ctx,fL,fT,SW,mainH,R); ctx.clip();

    const fg=ctx.createLinearGradient(0,fT,0,fB);
    fg.addColorStop(0,theme.top); fg.addColorStop(0.18,theme.side); fg.addColorStop(1,theme.sideD);
    ctx.fillStyle=fg; ctx.fill();

    // Inner lighter top strip (revealed cut)
    if(layersDone>0||slicePct>0.05){
      const ih=Math.min(SH_UNIT*0.65,mainH*0.22);
      const ig=ctx.createLinearGradient(0,fT,0,fT+ih);
      ig.addColorStop(0,theme.topH); ig.addColorStop(1,theme.top+'00');
      ctx.fillStyle=ig; ctx.fillRect(fL,fT,SW,ih);
    }

    // Bubble texture
    ctx.globalAlpha=0.09; ctx.fillStyle='#fff';
    for(let i=0;i<14;i++){
      const bx=fL+pr(i*7)*SW, by=fT+pr(i*13)*mainH, br=5+pr(i*3)*12;
      ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    // Front shine
    const shg=ctx.createLinearGradient(fL,fT,fL+SW*0.3,fT+mainH*0.4);
    shg.addColorStop(0,'rgba(255,255,255,0.25)'); shg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=shg; ctx.fillRect(fL,fT,SW,mainH);

    // Layer lines on front
    for(let l=1;l<remaining;l++){
      const ly=fB-l*SH_UNIT; if(ly<fT||ly>fB) continue;
      ctx.strokeStyle='rgba(0,0,0,0.11)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(fL+R,ly); ctx.lineTo(fR-R,ly); ctx.stroke();
    }
    ctx.restore();

    // Front outline
    ctx.save(); rr(ctx,fL,fT,SW,mainH,R);
    ctx.strokeStyle='rgba(0,0,0,.09)'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }

  // SLAB sliding off
  if(slabH>1&&slicePct<1){
    const ox=slicePct*62, oy=slicePct*24;
    const sT=fT-slabH, sB=fT;
    const R2=Math.min(14,SW*0.055,slabH*0.45);
    ctx.save(); ctx.translate(ox,oy);

    // Slab right side
    drawFace([[fR,sB],[fR+DEPTH_X,sB+DEPTH_Y],[fR+DEPTH_X,sT+DEPTH_Y],[fR,sT]],
      ctx=>{ ctx.fillStyle=theme.sideR; ctx.fill(); });

    // Slab top
    drawFace([[fL,sT],[fR,sT],[fR+DEPTH_X,sT+DEPTH_Y],[fL+DEPTH_X,sT+DEPTH_Y]],
      ctx=>{ ctx.fillStyle=theme.topH; ctx.fill(); });

    // Slab front
    rr(ctx,fL,sT,SW,slabH,R2);
    const sfg=ctx.createLinearGradient(0,sT,0,sB);
    sfg.addColorStop(0,theme.topH); sfg.addColorStop(1,theme.side);
    ctx.fillStyle=sfg; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.07)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  }

  // Progress bar
  const pct=Math.max(0,(remaining*SH_UNIT-slicePct*SH_UNIT)/FULL_H);
  document.getElementById('bar').style.width=(pct*100)+'%';
}

// Draw polygon face helper
function drawFace(pts, fillFn) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  fillFn(ctx);
  ctx.restore();
}

// Rounded rect path
function rr(ctx,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);   ctx.quadraticCurveTo(x+w,y,  x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);   ctx.quadraticCurveTo(x,  y+h,x,  y+h-r);
  ctx.lineTo(x,y+r);     ctx.quadraticCurveTo(x,  y,  x+r,y);
  ctx.closePath();
}

function pr(seed){ const x=Math.sin(seed+1)*10000; return x-Math.floor(x); }

// ─── INPUT ────────────────────────────────────
function getXY(e){
  return e.touches
    ? {x:e.touches[0].clientX, y:e.touches[0].clientY}
    : {x:e.clientX,            y:e.clientY};
}

function hitSoap(x,y){
  const rem=TOTAL_LAYERS-layersDone;
  const mainH=rem*SH_UNIT-slicePct*SH_UNIT;
  const fB=SOAP_BOT, fT=fB-mainH-slicePct*SH_UNIT;
  return x>CX-SW/2-30 && x<CX+SW/2+DEPTH_X+30 && y>fT-30 && y<fB+30;
}

canvas.addEventListener('mousedown',e=>{
  initAudio(); const p=getXY(e);
  if(hitSoap(p.x,p.y)){active=true;lastX=p.x;}
});
document.addEventListener('mousemove',e=>{
  const p=getXY(e); moveKnife(p.x,p.y);
  if(active&&canCut) doCut(p.x,p.y);
});
document.addEventListener('mouseup',()=>active=false);

canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); initAudio(); const p=getXY(e);
  if(hitSoap(p.x,p.y)){active=true;lastX=p.x;}
},{passive:false});
document.addEventListener('touchmove',e=>{
  e.preventDefault(); const p=getXY(e); moveKnife(p.x,p.y);
  if(active&&canCut) doCut(p.x,p.y);
},{passive:false});
document.addEventListener('touchend',()=>active=false);
document.addEventListener('mouseleave',()=>{active=false;knifeWrap.style.display='none';});

function moveKnife(x,y){
  knifeWrap.style.display='block';
  knifeWrap.style.left=(x-175)+'px';
  knifeWrap.style.top=(y-18)+'px';
}

function doCut(x,y){
  const dx=Math.abs(x-lastX); if(dx<1.5) return;
  lastX=x;
  slicePct=Math.min(1,slicePct+dx*0.0075);
  sndTick++; if(sndTick%3===0) playScrape();
  if(Math.random()<0.5) spawnChunk(x,y,false);
  if(slicePct>=1) finishLayer(x,y);
}

// ─── CHUNKS ───────────────────────────────────
function spawnChunk(x,y,big){
  const n=big?4:1;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='ck';
    const s=big?8+Math.random()*20:4+Math.random()*12;
    const col=[theme.side,theme.top,theme.sideR,theme.topH][Math.floor(Math.random()*4)];
    el.style.cssText=`width:${s}px;height:${s*(0.4+Math.random()*.9)}px;`+
      `left:${x-s/2}px;top:${y-s/2}px;background:${col};`+
      `border-radius:${Math.random()>.4?'50%':'5px'};`;
    const ang=-Math.PI*0.2+(Math.random()-.5)*Math.PI;
    const d=(big?60:28)+Math.random()*100;
    el.style.setProperty('--x',Math.cos(ang)*d+'px');
    el.style.setProperty('--y',Math.sin(ang)*d+35+Math.random()*35+'px');
    el.style.setProperty('--r',(Math.random()*540-270)+'deg');
    const t=0.4+Math.random()*0.55;
    el.style.setProperty('--t',t+'s');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),t*1000+100);
  }
}

function scorePop(txt,x,y){
  const el=document.createElement('div');
  el.className='spt'; el.textContent=txt;
  el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

// ─── LAYER DONE ───────────────────────────────
function finishLayer(px,py){
  canCut=false; active=false; playPop();
  for(let i=0;i<24;i++)
    setTimeout(()=>spawnChunk(px+(Math.random()-.5)*200,py+(Math.random()-.5)*70,true),i*30);
  const pts=50+layersDone*12;
  score+=pts; document.getElementById('hscore').textContent=score;
  scorePop('+'+pts,px,py-40);
  setTimeout(()=>{
    layersDone++; slicePct=0;
    if(layersDone>=TOTAL_LAYERS) setTimeout(showWin,400);
    else canCut=true;
  },650);
}
