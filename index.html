<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Soap Cutting</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;}
body{background:#d4bfa0;font-family:-apple-system,sans-serif;font-weight:700;cursor:none;}

#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(4px);
}
.pill{background:#fff;border-radius:50px;padding:7px 16px;font-size:.95rem;color:#333;
  box-shadow:0 2px 8px rgba(0,0,0,.15);}
#bar-wrap{flex:1;height:14px;background:rgba(0,0,0,.2);border-radius:10px;overflow:hidden;}
#bar{height:100%;width:100%;border-radius:10px;
  background:linear-gradient(90deg,#e65c00,#f9a825);transition:width .1s;}

/* Full screen SVG – no canvas sizing issues */
#gamesvg{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;
  overflow:visible;
}

#knife-el{
  position:fixed;z-index:999;pointer-events:none;display:none;
  font-size:48px;transform:rotate(-35deg);
  filter:drop-shadow(2px 3px 6px rgba(0,0,0,.4));
  transform-origin:80% 80%;
}

.chunk{position:fixed;pointer-events:none;z-index:500;border-radius:5px;
  animation:fly var(--t) ease-out forwards;}
@keyframes fly{
  0%{opacity:1;transform:translate(0,0)rotate(0)scale(1);}
  100%{opacity:0;transform:translate(var(--x),var(--y))rotate(var(--r))scale(.08);}
}
.pts{position:fixed;z-index:600;pointer-events:none;font-size:1.4rem;
  color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);
  animation:ptsA .8s ease-out forwards;}
@keyframes ptsA{0%{opacity:1;transform:translateY(0)scale(1);}
  100%{opacity:0;transform:translateY(-55px)scale(1.25);}}

/* WIN */
#win{display:none;position:fixed;inset:0;z-index:700;
  background:rgba(0,0,0,.6);align-items:center;justify-content:center;}
#win.on{display:flex;}
.wcard{background:linear-gradient(135deg,#fffaf4,#ffe8c4);border-radius:28px;
  padding:36px 44px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:wpop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes wpop{from{transform:scale(.3)rotate(-10deg);}to{transform:scale(1)rotate(0);}}
#wem{font-size:5.5rem;display:block;margin-bottom:8px;
  animation:wemb .6s .1s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes wemb{from{transform:scale(0);}to{transform:scale(1);}}
.wh{font-size:1.7rem;color:#333;margin-bottom:4px;}
.ws{color:#aaa;font-size:.9rem;margin-bottom:22px;}
.btn{background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;border:none;
  border-radius:50px;padding:13px 40px;font-family:inherit;font-weight:700;
  font-size:1.05rem;cursor:pointer;box-shadow:0 6px 20px rgba(230,92,0,.4);}
.btn:active{transform:scale(.95);}

/* AD */
#ad{display:none;position:fixed;inset:0;z-index:800;
  background:#0f172a;align-items:center;justify-content:center;}
#ad.on{display:flex;}
.abox{background:#1e293b;border:1px solid rgba(255,255,255,.1);border-radius:24px;
  padding:40px;text-align:center;width:min(320px,88%);}
.aico{font-size:3.5rem;display:block;margin-bottom:10px;}
.ah{font-size:1.5rem;color:#fff;margin-bottom:5px;}
.ap{color:rgba(255,255,255,.4);font-size:.85rem;margin-bottom:18px;}
#adn{font-size:2.8rem;color:#f9a825;margin-bottom:14px;}
#adbtn{background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;border:none;
  border-radius:50px;padding:13px 34px;font-family:inherit;font-weight:700;
  font-size:1rem;cursor:pointer;opacity:.3;pointer-events:none;transition:opacity .3s;}
#adbtn.on{opacity:1;pointer-events:all;}

#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  color:rgba(0,0,0,.25);font-size:.82rem;pointer-events:none;z-index:50;white-space:nowrap;}
</style>
</head>
<body>

<div id="hud">
  <div class="pill">LVL <span id="hlvl">1</span></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div class="pill">⭐ <span id="hscore">0</span></div>
</div>

<!-- SVG-based game — no canvas sizing bugs -->
<svg id="gamesvg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="frontClip"><rect id="frontClipRect" x="60" y="150" width="280" height="480" rx="20"/></clipPath>
    <!-- gradients updated via JS -->
    <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop id="gF0" offset="0%"   stop-color="#f5ddb0"/>
      <stop id="gF1" offset="18%"  stop-color="#c87848"/>
      <stop id="gF2" offset="100%" stop-color="#a05c30"/>
    </linearGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop id="gT0" offset="0%"   stop-color="#fcefd8"/>
      <stop id="gT1" offset="50%"  stop-color="#f5ddb0"/>
      <stop id="gT2" offset="100%" stop-color="#fcefd8"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop id="gR0" offset="0%"   stop-color="#d89060"/>
      <stop id="gR1" offset="100%" stop-color="#a05c30"/>
    </linearGradient>
    <linearGradient id="gSlab" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop id="gS0" offset="0%"   stop-color="#fcefd8"/>
      <stop id="gS1" offset="100%" stop-color="#c87848"/>
    </linearGradient>
    <radialGradient id="gShine" cx="30%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse id="shadow" cx="230" cy="660" rx="160" ry="28" fill="url(#gShadow)"/>

  <!-- RIGHT side face -->
  <polygon id="faceRight"
    points="340,150 400,120 400,630 340,660"
    fill="url(#gRight)" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>

  <!-- TOP face -->
  <polygon id="faceTop"
    points="60,150 340,150 400,120 120,120"
    fill="url(#gTop)" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>

  <!-- FRONT face group -->
  <g clip-path="url(#frontClip)">
    <rect id="frontBase" x="60" y="150" width="280" height="510" rx="20" fill="url(#gFront)"/>
    <!-- Shine overlay -->
    <rect x="60" y="150" width="280" height="510" rx="20" fill="url(#gShine)"/>
    <!-- Inner lighter strip at top (revealed) -->
    <rect id="innerStrip" x="60" y="150" width="280" height="0" fill="#fcefd8" opacity="0.7"/>
    <!-- Layer lines -->
    <g id="layerLines" stroke="rgba(0,0,0,0.11)" stroke-width="1.5"/>
    <!-- Bubble texture (static) -->
    <circle cx="110" cy="220" r="14" fill="white" opacity="0.08"/>
    <circle cx="290" cy="280" r="18" fill="white" opacity="0.07"/>
    <circle cx="160" cy="380" r="10" fill="white" opacity="0.09"/>
    <circle cx="310" cy="430" r="15" fill="white" opacity="0.06"/>
    <circle cx="90"  cy="490" r="12" fill="white" opacity="0.08"/>
    <circle cx="240" cy="550" r="9"  fill="white" opacity="0.07"/>
  </g>
  <!-- Front border -->
  <rect id="frontBorder" x="60" y="150" width="280" height="510" rx="20"
    fill="none" stroke="rgba(0,0,0,0.09)" stroke-width="2"/>

  <!-- SLAB being cut (slides right) -->
  <g id="slabGroup" opacity="0">
    <polygon id="slabRight" points="340,90 400,60 400,120 340,150" fill="#d89060"/>
    <polygon id="slabTop"   points="60,90 340,90 400,60 120,60"    fill="#fcefd8"/>
    <rect id="slabFront" x="60" y="90" width="280" height="60" rx="14" fill="url(#gSlab)"/>
  </g>

  <!-- Emoji revealed on top face -->
  <text id="revealEmoji" x="245" y="135" font-size="0" text-anchor="middle"
    dominant-baseline="middle" opacity="0">😊</text>
</svg>

<!-- Knife emoji cursor -->
<div id="knife-el">🔪</div>

<!-- Win -->
<div id="win">
  <div class="wcard">
    <span id="wem">🌟</span>
    <div class="wh" id="wh">Находка!</div>
    <div class="ws" id="ws">Внутри мыла</div>
    <button class="btn" onclick="doNextLevel()">Следующий →</button>
  </div>
</div>

<!-- Ad -->
<div id="ad">
  <div class="abox">
    <span class="aico">📺</span>
    <div class="ah">Реклама</div>
    <div class="ap">Посмотри и продолжи!</div>
    <div id="adn">5</div>
    <button id="adbtn" onclick="skipAd()">Продолжить →</button>
  </div>
</div>

<div id="hint">Веди ножом по мылу ↔</div>

<script>
// ── AUDIO ─────────────────────────────────────
let AC=null;
function initAudio(){
  if(AC) return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
function playScrape(){
  if(!AC) return;
  try{
    const dur=0.06+Math.random()*0.04,sr=AC.sampleRate;
    const buf=AC.createBuffer(1,Math.floor(sr*dur),sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(i/d.length*Math.PI)*0.5;
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=700+Math.random()*600; f.Q.value=1.5;
    const g=AC.createGain(); g.gain.value=0.25;
    src.connect(f);f.connect(g);g.connect(AC.destination);
    src.start();src.stop(AC.currentTime+dur);
  }catch(e){}
}
function playPop(){
  if(!AC) return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(300,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.2);
    g.gain.setValueAtTime(0.4,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.25);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+0.3);
  }catch(e){}
}
function playTring(){
  if(!AC) return;
  try{
    const t=AC.currentTime;
    [[1047,0],[1319,0.04],[1568,0.08]].forEach(([f,dl])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+dl);
      g.gain.linearRampToValueAtTime(0.3,t+dl+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+dl+1.1);
      o.connect(g);g.connect(AC.destination);
      o.start(t+dl);o.stop(t+dl+1.2);
    });
  }catch(e){}
}

// ── DATA ──────────────────────────────────────
const THEMES=[
  {top:'#f5ddb0',topH:'#fcefd8',side:'#c87848',sideD:'#a05c30',sideR:'#d89060',name:'Персиковое'},
  {top:'#b0d8f5',topH:'#d8f0ff',side:'#3a70c0',sideD:'#2a5098',sideR:'#5090d8',name:'Синее'},
  {top:'#b8f0b0',topH:'#d8ffd0',side:'#38a050',sideD:'#287838',sideR:'#58c068',name:'Мятное'},
  {top:'#f5b0c8',topH:'#ffd8e8',side:'#c03870',sideD:'#982858',sideR:'#d85888',name:'Розовое'},
  {top:'#c8b0f5',topH:'#e8d8ff',side:'#7040c0',sideD:'#502898',sideR:'#9060d8',name:'Лавандовое'},
];
const REWARDS=['😊','🌟','🦋','🌈','🦄','💎','🐉','🌙','🍀','🔮','👑','🎭','🐬','🦊','🐱','🌺'];
const TOTAL=8;

// SVG viewBox coords (fixed 400×800)
const VBW=400, VBH=800;
// Soap front face in SVG units
const FL=60, FW=280;   // left x, width
const FB=660;          // bottom y (fixed)
const LAYER_H=60;      // height of each layer in SVG units
const FULL_H=TOTAL*LAYER_H; // 480
const FT_FULL=FB-FULL_H;    // 180 — top when full

// Depth for pseudo-3D
const DX=60, DY=-30;  // right face goes +60x, -30y

// ── STATE ─────────────────────────────────────
let level=1,score=0;
let theme,reward;
let layersDone=0,slicePct=0;
let canCut=true,active=false,lastX=0,sndTick=0;

// ── SVG ELEMENTS ──────────────────────────────
const $ = id=>document.getElementById(id);
const svgEl       = $('gamesvg');
const faceRight   = $('faceRight');
const faceTop     = $('faceTop');
const frontBase   = $('frontBase');
const frontBorder = $('frontBorder');
const frontClipR  = $('frontClipRect');
const innerStrip  = $('innerStrip');
const layerLinesG = $('layerLines');
const slabGroup   = $('slabGroup');
const slabRight   = $('slabRight');
const slabTop     = $('slabTop');
const slabFront   = $('slabFront');
const revEmoji    = $('revealEmoji');
const shadowEl    = $('shadow');
const knifeEl     = $('knife-el');

// ── APPLY THEME ───────────────────────────────
function applyTheme(th){
  $('gF0').setAttribute('stop-color',th.topH);
  $('gF1').setAttribute('stop-color',th.side);
  $('gF2').setAttribute('stop-color',th.sideD);
  $('gT0').setAttribute('stop-color',th.topH);
  $('gT1').setAttribute('stop-color',th.top);
  $('gT2').setAttribute('stop-color',th.topH);
  $('gR0').setAttribute('stop-color',th.sideR);
  $('gR1').setAttribute('stop-color',th.sideD);
  $('gS0').setAttribute('stop-color',th.topH);
  $('gS1').setAttribute('stop-color',th.side);
  innerStrip.setAttribute('fill',th.topH);
}

// ── UPDATE SVG GEOMETRY ───────────────────────
function updateSVG(){
  const remaining=TOTAL-layersDone;
  // Top of main block
  const ft=FB-remaining*LAYER_H; // y of top of main block
  // Slab offset
  const ox=slicePct*55, oy=slicePct*22;

  // Clip rect
  const clipH=remaining*LAYER_H;
  frontClipR.setAttribute('y',ft);
  frontClipR.setAttribute('height',clipH);

  // Front face
  frontBase.setAttribute('y',ft);
  frontBase.setAttribute('height',clipH);
  frontBorder.setAttribute('y',ft);
  frontBorder.setAttribute('height',clipH);

  // Inner strip (revealed cut top)
  if(layersDone>0||slicePct>0.05){
    const ih=Math.min(LAYER_H*0.5,clipH*0.2);
    innerStrip.setAttribute('y',ft);
    innerStrip.setAttribute('height',ih);
  } else {
    innerStrip.setAttribute('height',0);
  }

  // Right face
  faceRight.setAttribute('points',
    `${FL+FW},${ft} ${FL+FW+DX},${ft+DY} ${FL+FW+DX},${FB+DY} ${FL+FW},${FB}`);

  // Top face
  faceTop.setAttribute('points',
    `${FL},${ft} ${FL+FW},${ft} ${FL+FW+DX},${ft+DY} ${FL+DX},${ft+DY}`);

  // Shadow
  shadowEl.setAttribute('cy',FB+25);
  shadowEl.setAttribute('rx',100+remaining*8);

  // Layer lines
  layerLinesG.innerHTML='';
  for(let l=1;l<remaining;l++){
    const ly=FB-l*LAYER_H;
    if(ly<=ft) continue;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',FL+10); line.setAttribute('y1',ly);
    line.setAttribute('x2',FL+FW-10); line.setAttribute('y2',ly);
    layerLinesG.appendChild(line);
  }

  // Emoji reveal on top face
  const pct=layersDone/TOTAL;
  if(layersDone>0){
    revEmoji.textContent=reward;
    revEmoji.setAttribute('x', FL+FW/2+DX*0.4);
    revEmoji.setAttribute('y', ft+DY*0.5);
    revEmoji.setAttribute('font-size', Math.round(8+pct*36));
    revEmoji.setAttribute('opacity', Math.min(1,pct*2.5));
  } else {
    revEmoji.setAttribute('font-size',0);
    revEmoji.setAttribute('opacity',0);
  }

  // Slab
  if(slicePct>0.01&&slicePct<1){
    slabGroup.setAttribute('opacity','1');
    slabGroup.setAttribute('transform',`translate(${ox},${oy})`);
    const sT=ft-LAYER_H, sB=ft;
    slabRight.setAttribute('points',
      `${FL+FW},${sB} ${FL+FW+DX},${sB+DY} ${FL+FW+DX},${sT+DY} ${FL+FW},${sT}`);
    slabTop.setAttribute('points',
      `${FL},${sT} ${FL+FW},${sT} ${FL+FW+DX},${sT+DY} ${FL+DX},${sT+DY}`);
    slabFront.setAttribute('x',FL);
    slabFront.setAttribute('y',sT);
    slabFront.setAttribute('width',FW);
    slabFront.setAttribute('height',LAYER_H);
  } else {
    slabGroup.setAttribute('opacity','0');
  }

  // Progress bar
  const p=Math.max(0,(remaining*LAYER_H-slicePct*LAYER_H)/FULL_H);
  $('bar').style.width=(p*100)+'%';
}

// ── CONVERT SCREEN → SVG COORDS ───────────────
function screenToSVG(screenX,screenY){
  const rect=svgEl.getBoundingClientRect();
  // SVG is preserveAspectRatio xMidYMid meet inside the screen rect
  const scaleX=VBW/rect.width, scaleY=VBH/rect.height;
  const scale=Math.max(scaleX,scaleY); // "meet" uses the smaller scale... actually:
  // meet = fit entire viewBox, so scale = min
  const sc=Math.min(rect.width/VBW, rect.height/VBH);
  const offX=(rect.width  - VBW*sc)/2;
  const offY=(rect.height - VBH*sc)/2;
  return {
    x:(screenX - rect.left - offX)/sc,
    y:(screenY - rect.top  - offY)/sc
  };
}

function hitSoap(sx,sy){
  // In SVG coords
  const p=screenToSVG(sx,sy);
  const remaining=TOTAL-layersDone;
  const ft=FB-remaining*LAYER_H;
  return p.x>=FL-20 && p.x<=FL+FW+DX+20 && p.y>=ft-LAYER_H-20 && p.y<=FB+20;
}

// ── INPUT ─────────────────────────────────────
function getXY(e){
  return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};
}

svgEl.addEventListener('mousedown',e=>{
  initAudio(); const p=getXY(e);
  if(hitSoap(p.x,p.y)){active=true;lastX=p.x;}
});
document.addEventListener('mousemove',e=>{
  const p=getXY(e); moveKnife(p.x,p.y);
  if(active&&canCut) doCut(p.x,p.y);
});
document.addEventListener('mouseup',()=>active=false);

svgEl.addEventListener('touchstart',e=>{
  e.preventDefault(); initAudio(); const p=getXY(e);
  if(hitSoap(p.x,p.y)){active=true;lastX=p.x;}
},{passive:false});
document.addEventListener('touchmove',e=>{
  e.preventDefault(); const p=getXY(e); moveKnife(p.x,p.y);
  if(active&&canCut) doCut(p.x,p.y);
},{passive:false});
document.addEventListener('touchend',()=>active=false);
document.addEventListener('mouseleave',()=>{active=false;knifeEl.style.display='none';});

function moveKnife(x,y){
  knifeEl.style.display='block';
  knifeEl.style.left=(x-38)+'px';
  knifeEl.style.top=(y-42)+'px';
}

function doCut(x,y){
  const dx=Math.abs(x-lastX); if(dx<2) return;
  lastX=x;
  slicePct=Math.min(1,slicePct+dx*0.007);
  sndTick++; if(sndTick%3===0) playScrape();
  if(Math.random()<0.5) spawnChunk(x,y,false);
  updateSVG();
  if(slicePct>=1) finishLayer(x,y);
}

// ── PARTICLES ─────────────────────────────────
function spawnChunk(x,y,big){
  const n=big?5:1;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='chunk';
    const s=big?8+Math.random()*18:4+Math.random()*10;
    const cols=[theme.side,theme.top,theme.sideR,theme.topH];
    const col=cols[Math.floor(Math.random()*cols.length)];
    el.style.cssText=`width:${s}px;height:${s*(0.4+Math.random()*.8)}px;`+
      `left:${x-s/2}px;top:${y-s/2}px;background:${col};`+
      `border-radius:${Math.random()>.4?'50%':'4px'};`;
    const ang=-0.6+(Math.random()-.5)*2;
    const d=(big?55:25)+Math.random()*90;
    el.style.setProperty('--x',Math.cos(ang)*d+'px');
    el.style.setProperty('--y',Math.sin(ang)*d+30+Math.random()*30+'px');
    el.style.setProperty('--r',(Math.random()*500-250)+'deg');
    const t=0.4+Math.random()*0.5;
    el.style.setProperty('--t',t+'s');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),t*1000+100);
  }
}

function scorePop(txt,x,y){
  const el=document.createElement('div');
  el.className='pts'; el.textContent=txt;
  el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

// ── FINISH LAYER ──────────────────────────────
function finishLayer(px,py){
  canCut=false;active=false;playPop();
  for(let i=0;i<22;i++)
    setTimeout(()=>spawnChunk(px+(Math.random()-.5)*180,py+(Math.random()-.5)*60,true),i*30);
  const pts=50+layersDone*12;
