*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  overflow:hidden;touch-action:none;user-select:none;cursor:none;
  font-family:-apple-system,sans-serif;font-weight:700;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#f0e2cc,#d8c4a0 55%,#b89a70);
}

/* HUD */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:10px;padding:12px 14px;
}
.pill{
  background:#fff;border-radius:50px;padding:7px 16px;font-size:1rem;color:#333;
  box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap;
}
#bar-wrap{flex:1;height:14px;background:rgba(0,0,0,.18);border-radius:10px;overflow:hidden;}
#bar{height:100%;border-radius:10px;background:linear-gradient(90deg,#e65c00,#f9a825);transition:width .1s;width:100%;}

/* STAGE */
#stage{
  position:fixed;top:60px;left:0;right:0;bottom:50px;
  display:flex;align-items:center;justify-content:center;
}

/* SOAP */
#top-face{
  position:absolute;top:0;left:22px;
  width:238px;height:22px;
  clip-path:polygon(0 100%,20px 0,238px 0,218px 100%);
  z-index:3;
}
#right-face{position:absolute;top:22px;right:0;width:42px;z-index:2;}
#front-face{
  position:absolute;top:22px;left:0;width:218px;
  border-radius:14px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.3);
  z-index:4;
}
#front-face::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 55%);
  pointer-events:none;border-radius:14px;
}
#cut-strip{position:absolute;top:0;left:0;right:0;height:0;pointer-events:none;}
#layer-lines{position:absolute;inset:0;pointer-events:none;}
.ll{position:absolute;left:8px;right:8px;height:1.5px;background:rgba(0,0,0,.10);}
#emoji-on-front{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:0;opacity:0;pointer-events:none;transition:font-size .3s,opacity .3s;z-index:5;
}
#slab{
  position:absolute;left:0;top:0;width:218px;
  border-radius:12px;opacity:0;pointer-events:none;
  box-shadow:2px 3px 10px rgba(0,0,0,.2);z-index:6;overflow:hidden;
}
#slab::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0));border-radius:12px;
}
#gshadow{
  position:absolute;bottom:-24px;left:20px;width:200px;height:20px;
  background:radial-gradient(ellipse,rgba(0,0,0,.2) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}

/* KNIFE */
#knife{
  position:fixed;z-index:999;pointer-events:none;display:none;
  font-size:50px;line-height:1;
  transform:rotate(-38deg) scaleX(-1);
  filter:drop-shadow(2px 4px 8px rgba(0,0,0,.4));
}

/* CHUNKS */
.ck{position:fixed;pointer-events:none;z-index:500;border-radius:5px;animation:ckfly .6s ease-out forwards;}
@keyframes ckfly{
  0%{opacity:1;transform:translate(0,0)rotate(0)scale(1);}
  100%{opacity:0;transform:translate(var(--x),var(--y))rotate(var(--r))scale(.05);}
}

/* SCORE POP */
.spt{position:fixed;z-index:600;pointer-events:none;font-size:1.4rem;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.5);animation:sptA .8s ease-out forwards;}
@keyframes sptA{0%{opacity:1;transform:translateY(0)scale(1);}100%{opacity:0;transform:translateY(-55px)scale(1.2);}}

/* WIN */
#win{display:none;position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.6);align-items:center;justify-content:center;}
#win.on{display:flex;}
.wcard{

  box-shadow:0 20px 60px rgba(0,0,0,.35);animation:wpop .5s cubic-bezier(.34,1.56,.64,1) both;

@keyframes wpop{from{transform:scale(.3)rotate(-10deg);}to{transform:scale(1)rotate(0);}}
#wem{font-size:5.5rem;display:block;margin-bottom:8px;animation:eb .6s .1s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes eb{from{transform:scale(0);}to{transform:scale(1);}}

.ws{color:#aaa;font-size:.9rem;margin-bottom:22px;}

.ad-note{color:rgba(255,255,255,.3);font-size:.75rem;margin-top:8px;}

/* SAVE TOAST */
#save-toast{

var AC = null;
function unlockAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playScrape() {
  if (!AC) return;
  try {
    var dur=0.06, sr=AC.sampleRate;
    var buf=AC.createBuffer(1,Math.floor(sr*dur),sr);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(i/d.length*3.14)*0.5;
    var src=AC.createBufferSource(); src.buffer=buf;
    var f=AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=700+Math.random()*500;
    var g=AC.createGain(); g.gain.value=0.22;
    src.connect(f);f.connect(g);g.connect(AC.destination);
    src.start();src.stop(AC.currentTime+dur);
  } catch(e) {}
}
function playPop() {
  if (!AC) return;
  try {
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(300,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.2);
    g.gain.setValueAtTime(0.4,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.25);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+0.3);
  } catch(e) {}
}
function playTring() {
  if (!AC) return;
  try {
    var t=AC.currentTime;

      var o=AC.createOscillator(),g=AC.createGain();

      g.gain.setValueAtTime(0,t+pair[1]);
      g.gain.linearRampToValueAtTime(0.28,t+pair[1]+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+pair[1]+1.1);
      o.connect(g);g.connect(AC.destination);
      o.start(t+pair[1]);o.stop(t+pair[1]+1.2);
    });
  } catch(e) {}
}

// ═══════════════════════════════════════════
//  SAVE / LOAD  (localStorage)
// ═══════════════════════════════════════════
function saveProgress() {
  try {
    localStorage.setItem('soap_level', level);
    localStorage.setItem('soap_score', score);
    localStorage.setItem('soap_collection', JSON.stringify(collection));
    showSaveToast();
  } catch(e) {}
}

function loadProgress() {
  try {
    var sl = localStorage.getItem('soap_level');
    var ss = localStorage.getItem('soap_score');
    var sc = localStorage.getItem('soap_collection');
    if (sl) level = parseInt(sl) || 1;
    if (ss) score = parseInt(ss) || 0;
    if (sc) collection = JSON.parse(sc) || [];
  } catch(e) {}
}

function showSaveToast() {
  var t = document.getElementById('save-toast');
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

// Auto-save when page closes / hides
document.addEventListener('visibilitychange', function() {
  if (document.hidden) saveProgress();
});
window.addEventListener('pagehide', saveProgress);
window.addEventListener('beforeunload', saveProgress);
