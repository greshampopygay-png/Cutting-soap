<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🧼 Soap Cutting</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  cursor:none;
  font-family:-apple-system,sans-serif;
  font-weight:700;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#f0e2cc,#d8c4a0 55%,#b89a70);
}

/* HUD */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:10px;padding:12px 14px;
}
.pill{
  background:#fff;border-radius:50px;
  padding:7px 16px;font-size:1rem;color:#333;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  white-space:nowrap;
}
#bar-wrap{
  flex:1;height:14px;
  background:rgba(0,0,0,.18);
  border-radius:10px;overflow:hidden;
}
#bar{
  height:100%;border-radius:10px;
  background:linear-gradient(90deg,#e65c00,#f9a825);
  transition:width .1s;width:100%;
}

/* CENTER STAGE */
#stage{
  position:fixed;
  top:60px;left:0;right:0;bottom:50px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SOAP WRAPPER */
#soap-wrap{
  position:relative;
  /* Fixed pixel size — no calculations needed */
  width:260px;
  height:380px; /* will shrink via JS on layer cut */
}

/* TOP face */
#top-face{
  position:absolute;
  top:0;left:22px;
  width:238px;height:22px;
  background:#fcefd8;
  clip-path:polygon(0 100%,20px 0,238px 0,218px 100%);
  z-index:3;
}

/* RIGHT face */
#right-face{
  position:absolute;
  top:22px;right:0;
  width:42px;
  background:linear-gradient(135deg,#d89060,#905028);
  z-index:2;
  /* height set by JS */
}

/* FRONT face */
#front-face{
  position:absolute;
  top:22px;left:0;
  width:218px;
  background:linear-gradient(180deg,#fcefd8 0%,#c87848 15%,#904020 100%);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.22),
             inset 0 1px 0 rgba(255,255,255,.3);
  z-index:4;
  /* height set by JS */
}

/* Shine on front */
#front-face::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 55%);
  pointer-events:none;border-radius:14px;
}

/* Cut reveal strip */
#cut-strip{
  position:absolute;top:0;left:0;right:0;
  height:0;
  background:linear-gradient(180deg,#fcefd8 0%,transparent 100%);
  pointer-events:none;
  transition:height .05s;
}

/* Layer lines container */
#layer-lines{position:absolute;inset:0;pointer-events:none;}
.ll{
  position:absolute;left:8px;right:8px;
  height:1.5px;background:rgba(0,0,0,.10);
}

/* Emoji reveal (on front face) */
#emoji-on-front{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-size:0;opacity:0;
  pointer-events:none;
  transition:font-size .3s,opacity .3s;
  z-index:5;
}

/* SLAB */
#slab{
  position:absolute;
  left:0;top:0;
  width:218px;
  background:linear-gradient(180deg,#fcefd8,#c87848);
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  box-shadow:2px 3px 10px rgba(0,0,0,.2);
  z-index:6;
  overflow:hidden;
}
#slab::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0));
  border-radius:12px;
}

/* Ground shadow */
#gshadow{
  position:absolute;
  bottom:-24px;left:20px;
  width:200px;height:20px;
  background:radial-gradient(ellipse,rgba(0,0,0,.2) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}

/* KNIFE */
#knife{
  position:fixed;z-index:999;
  pointer-events:none;
  display:none;
  font-size:50px;
  line-height:1;
  transform:rotate(-38deg) scaleX(-1);
  filter:drop-shadow(2px 4px 8px rgba(0,0,0,.4));
}

/* CHUNK */
.ck{
  position:fixed;pointer-events:none;z-index:500;
  border-radius:5px;
  animation:ckfly .6s ease-out forwards;
}
@keyframes ckfly{
  0%  {opacity:1;transform:translate(0,0)rotate(0)scale(1);}
  100%{opacity:0;transform:translate(var(--x),var(--y))rotate(var(--r))scale(.05);}
}

/* SCORE POP */
.spt{
  position:fixed;z-index:600;pointer-events:none;
  font-size:1.4rem;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
  animation:sptA .8s ease-out forwards;
}
@keyframes sptA{
  0%  {opacity:1;transform:translateY(0)scale(1);}
  100%{opacity:0;transform:translateY(-55px)scale(1.2);}
}

/* WIN */
#win{
  display:none;position:fixed;inset:0;z-index:700;
  background:rgba(0,0,0,.6);
  align-items:center;justify-content:center;
}
#win.on{display:flex;}
.wcard{
  background:linear-gradient(135deg,#fffaf4,#ffe8c4);
  border-radius:28px;padding:36px 44px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:wpop .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes wpop{from{transform:scale(.3)rotate(-10deg);}to{transform:scale(1)rotate(0);}}
#wem{
  font-size:5.5rem;display:block;margin-bottom:8px;
  animation:eb .6s .1s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes eb{from{transform:scale(0);}to{transform:scale(1);}}
.wh{font-size:1.7rem;color:#333;margin-bottom:4px;}
.ws{color:#aaa;font-size:.9rem;margin-bottom:22px;}
.btn{
  background:linear-gradient(135deg,#e65c00,#f9a825);
  color:#fff;border:none;border-radius:50px;
  padding:13px 40px;font-family:inherit;font-weight:700;
  font-size:1.05rem;cursor:pointer;
  box-shadow:0 6px 20px rgba(230,92,0,.4);
}
.btn:active{transform:scale(.95);}

/* AD */
#ad{
  display:none;position:fixed;inset:0;z-index:800;
  background:#0f172a;
  align-items:center;justify-content:center;
}
#ad.on{display:flex;}
.abox{
  background:#1e293b;border:1px solid rgba(255,255,255,.1);
  border-radius:24px;padding:40px;text-align:center;
  width:min(320px,88%);
}
.aico{font-size:3.5rem;display:block;margin-bottom:10px;}
.ah{font-size:1.5rem;color:#fff;margin-bottom:5px;}
.ap{color:rgba(255,255,255,.4);font-size:.85rem;margin-bottom:18px;}
#adn{font-size:2.8rem;color:#f9a825;margin-bottom:14px;}
#adbtn{
  background:linear-gradient(135deg,#e65c00,#f9a825);
  color:#fff;border:none;border-radius:50px;
  padding:13px 34px;font-family:inherit;font-weight:700;
  font-size:1rem;cursor:pointer;opacity:.3;pointer-events:none;
  transition:opacity .3s;
}
#adbtn.on{opacity:1;pointer-events:all;}

/* HINT */
#hint{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  color:rgba(0,0,0,.25);font-size:.82rem;
  pointer-events:none;z-index:50;white-space:nowrap;
}
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div class="pill">LVL <span id="hlvl">1</span></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div class="pill">⭐ <span id="hscore">0</span></div>
</div>

<!-- STAGE -->
<div id="stage">
  <div id="soap-wrap">
    <div id="top-face"></div>
    <div id="right-face"></div>
    <div id="front-face">
      <div id="cut-strip"></div>
      <div id="layer-lines"></div>
      <div id="emoji-on-front"></div>
    </div>
    <div id="slab"></div>
    <div id="gshadow"></div>
  </div>
</div>

<!-- Knife -->
<div id="knife">🔪</div>

<!-- WIN -->
<div id="win">
  <div class="wcard">
    <span id="wem">🌟</span>
    <div class="wh" id="wh">Находка внутри!</div>
    <div class="ws" id="ws">Персиковое мыло</div>
    <button class="btn" onclick="goAd()">Следующий →</button>
  </div>
</div>

<!-- AD -->
<div id="ad">
  <div class="abox">
    <span class="aico">📺</span>
    <div class="ah">Реклама</div>
    <div class="ap">Посмотри и продолжи!</div>
    <div id="adn">5</div>
    <button id="adbtn" onclick="goNext()">Продолжить →</button>
  </div>
</div>

<div id="hint">Веди ножом по мылу ↔</div>

<script>
// ═══════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════
var AC = null;
function unlockAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playScrape() {
  if (!AC) return;
  try {
    var dur=0.06, sr=AC.sampleRate;
    var buf=AC.createBuffer(1,Math.floor(sr*dur),sr);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(i/d.length*3.14)*0.5;
    var src=AC.createBufferSource(); src.buffer=buf;
    var f=AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=700+Math.random()*500;
    var g=AC.createGain(); g.gain.value=0.22;
    src.connect(f);f.connect(g);g.connect(AC.destination);
    src.start();src.stop(AC.currentTime+dur);
  } catch(e) {}
}
function playPop() {
  if (!AC) return;
  try {
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(300,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.2);
    g.gain.setValueAtTime(0.4,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.25);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+0.3);
  } catch(e) {}
}
function playTring() {
  if (!AC) return;
  try {
    var t=AC.currentTime;
    [[1047,0],[1319,0.05],[1568,0.1]].forEach(function(pair) {
      var freq=pair[0], dl=pair[1];
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,t+dl);
      g.gain.linearRampToValueAtTime(0.28,t+dl+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+dl+1.1);
      o.connect(g);g.connect(AC.destination);
      o.start(t+dl);o.stop(t+dl+1.2);
    });
  } catch(e) {}
}

// ═══════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════
var THEMES = [
  {
    name:'Персиковое',
    front:'linear-gradient(180deg,#fcefd8 0%,#c87848 15%,#904020 100%)',
    top:'#fcefd8',
    right:'linear-gradient(135deg,#d89060,#905028)',
    slab:'linear-gradient(180deg,#fcefd8,#c87848)',
    strip:'#fcefd8',
    chunks:['#c87848','#f5ddb0','#d89060','#fcefd8']
  },
  {
    name:'Синее',
    front:'linear-gradient(180deg,#d8f0ff 0%,#3a70c0 15%,#1a4890 100%)',
    top:'#d8f0ff',
    right:'linear-gradient(135deg,#5090d8,#2a5098)',
    slab:'linear-gradient(180deg,#d8f0ff,#3a70c0)',
    strip:'#d8f0ff',
    chunks:['#3a70c0','#b0d8f5','#5090d8','#d8f0ff']
  },
  {
    name:'Мятное',
    front:'linear-gradient(180deg,#d8ffd0 0%,#38a050 15%,#186830 100%)',
    top:'#d8ffd0',
    right:'linear-gradient(135deg,#58c068,#287838)',
    slab:'linear-gradient(180deg,#d8ffd0,#38a050)',
    strip:'#d8ffd0',
    chunks:['#38a050','#b8f0b0','#58c068','#d8ffd0']
  },
  {
    name:'Розовое',
    front:'linear-gradient(180deg,#ffd8e8 0%,#c03870 15%,#801850 100%)',
    top:'#ffd8e8',
    right:'linear-gradient(135deg,#d85888,#982858)',
    slab:'linear-gradient(180deg,#ffd8e8,#c03870)',
    strip:'#ffd8e8',
    chunks:['#c03870','#f5b0c8','#d85888','#ffd8e8']
  },
  {
    name:'Лавандовое',
    front:'linear-gradient(180deg,#e8d8ff 0%,#7040c0 15%,#401890 100%)',
    top:'#e8d8ff',
    right:'linear-gradient(135deg,#9060d8,#502898)',
    slab:'linear-gradient(180deg,#e8d8ff,#7040c0)',
    strip:'#e8d8ff',
    chunks:['#7040c0','#c8b0f5','#9060d8','#e8d8ff']
  }
];
var REWARDS=['😊','🌟','🦋','🌈','🦄','💎','🐉','🌙','🍀','🔮','👑','🎭','🐬','🦊','🐱','🌺'];
var TOTAL = 8;
var LAYER_H = 38; // px per layer — fixed, no screen calculation

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
var level      = 1;
var score      = 0;
var theme      = THEMES[0];
var reward     = '😊';
var layersDone = 0;
var slicePct   = 0;
var canCut     = true;
var active     = false;
var lastX      = 0;
var sndTick    = 0;

// ═══════════════════════════════════════════
//  ELEMENTS
// ═══════════════════════════════════════════
var frontFace  = document.getElementById('front-face');
var rightFace  = document.getElementById('right-face');
var topFace    = document.getElementById('top-face');
var cutStrip   = document.getElementById('cut-strip');
var layerLines = document.getElementById('layer-lines');
var emojiEl    = document.getElementById('emoji-on-front');
var slabEl     = document.getElementById('slab');
var knifeEl    = document.getElementById('knife');
var barEl      = document.getElementById('bar');

// ═══════════════════════════════════════════
//  RENDER — update DOM based on state
// ═══════════════════════════════════════════
function render() {
  var remaining = TOTAL - layersDone;
  var frontH    = remaining * LAYER_H;
  var slabH     = Math.round(slicePct * LAYER_H);
  var slabOX    = Math.round(slicePct * 50);
  var slabOY    = Math.round(slicePct * 16);

  // FRONT
  frontFace.style.height     = frontH + 'px';
  frontFace.style.background = theme.front;

  // RIGHT
  rightFace.style.height     = frontH + 'px';
  rightFace.style.background = theme.right;
  rightFace.style.clipPath   = 'polygon(0 0, 42px -22px, 42px ' + (frontH-22) + 'px, 0 ' + frontH + 'px)';

  // TOP color
  topFace.style.background = theme.top;

  // Cut strip
  var stripH = (layersDone > 0 || slicePct > 0.05)
    ? Math.round(Math.min(LAYER_H * 0.5, frontH * 0.2)) : 0;
  cutStrip.style.height     = stripH + 'px';
  cutStrip.style.background = 'linear-gradient(180deg,' + theme.strip + ',transparent)';

  // Layer lines
  layerLines.innerHTML = '';
  for (var l = 1; l < remaining; l++) {
    var div = document.createElement('div');
    div.className = 'll';
    div.style.top = (l * LAYER_H) + 'px';
    layerLines.appendChild(div);
  }

  // Emoji reveal
  var pct = layersDone / TOTAL;
  if (layersDone > 0) {
    emojiEl.textContent  = reward;
    emojiEl.style.fontSize = Math.round(10 + pct * 32) + 'px';
    emojiEl.style.opacity  = Math.min(1, pct * 2.5);
  } else {
    emojiEl.style.fontSize = '0';
    emojiEl.style.opacity  = '0';
  }

  // SLAB
  if (slabH > 1 && slicePct < 1) {
    slabEl.style.opacity    = '1';
    slabEl.style.height     = slabH + 'px';
    slabEl.style.top        = (22 - slabH + slabOY) + 'px';
    slabEl.style.left       = slabOX + 'px';
    slabEl.style.background = theme.slab;
  } else {
    slabEl.style.opacity = '0';
  }

  // Progress bar
  var p = Math.max(0, (remaining * LAYER_H - slicePct * LAYER_H) / (TOTAL * LAYER_H));
  barEl.style.width = (p * 100) + '%';
}

// ═══════════════════════════════════════════
//  CHUNKS
// ═══════════════════════════════════════════
function spawnChunk(x, y, big) {
  var n = big ? 5 : 1;
  for (var i = 0; i < n; i++) {
    var el  = document.createElement('div');
    el.className = 'ck';
    var s   = big ? 8 + Math.random()*18 : 4 + Math.random()*10;
    var col = theme.chunks[Math.floor(Math.random() * theme.chunks.length)];
    el.style.width        = s + 'px';
    el.style.height       = (s * (0.4 + Math.random() * 0.8)) + 'px';
    el.style.left         = (x - s/2) + 'px';
    el.style.top          = (y - s/2) + 'px';
    el.style.background   = col;
    el.style.borderRadius = Math.random() > 0.4 ? '50%' : '4px';
    var ang = -0.5 + (Math.random() - 0.5) * 2.2;
    var d   = (big ? 55 : 25) + Math.random() * 90;
    el.style.setProperty('--x', Math.cos(ang)*d + 'px');
    el.style.setProperty('--y', Math.sin(ang)*d + 30 + Math.random()*30 + 'px');
    el.style.setProperty('--r', (Math.random()*480 - 240) + 'deg');
    document.body.appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 700);
  }
}

function scorePop(txt, x, y) {
  var el = document.createElement('div');
  el.className   = 'spt';
  el.textContent = txt;
  el.style.left  = x + 'px';
  el.style.top   = y + 'px';
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 900);
}

// ═══════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════
function getXY(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

document.getElementById('stage').addEventListener('mousedown', function(e) {
  unlockAudio(); active = true; lastX = getXY(e).x;
});
document.getElementById('stage').addEventListener('touchstart', function(e) {
  e.preventDefault(); unlockAudio(); active = true; lastX = getXY(e).x;
}, { passive: false });

document.addEventListener('mousemove', function(e) {
  var p = getXY(e);
  knifeEl.style.display = 'block';
  knifeEl.style.left    = (p.x - 30) + 'px';
  knifeEl.style.top     = (p.y - 48) + 'px';
  if (active && canCut) doCut(p.x, p.y);
});
document.addEventListener('touchmove', function(e) {
  e.preventDefault();
  var p = getXY(e);
  knifeEl.style.display = 'block';
  knifeEl.style.left    = (p.x - 30) + 'px';
  knifeEl.style.top     = (p.y - 48) + 'px';
  if (active && canCut) doCut(p.x, p.y);
}, { passive: false });

document.addEventListener('mouseup',   function() { active = false; });
document.addEventListener('touchend',  function() { active = false; });
document.addEventListener('mouseleave',function() { active = false; knifeEl.style.display = 'none'; });

function doCut(x, y) {
  var dx = Math.abs(x - lastX);
  if (dx < 1.5) return;
  lastX = x;

  slicePct = Math.min(1, slicePct + dx * 0.009);

  sndTick++;
  if (sndTick % 3 === 0) playScrape();

  if (Math.random() < 0.5) spawnChunk(x, y, false);

  render();

  if (slicePct >= 1) finishLayer(x, y);
}

// ═══════════════════════════════════════════
//  FINISH LAYER
// ═══════════════════════════════════════════
function finishLayer(px, py) {
  canCut = false; active = false;
  playPop();

  for (var i = 0; i < 22; i++) {
    (function(ii) {
      setTimeout(function() {
        spawnChunk(px + (Math.random()-.5)*180, py + (Math.random()-.5)*60, true);
      }, ii * 28);
    })(i);
  }

  var pts = 50 + layersDone * 12;
  score  += pts;
  document.getElementById('hscore').textContent = score;
  scorePop('+' + pts, px, py - 36);

  setTimeout(function() {
    layersDone++;
    slicePct = 0;
    if (layersDone >= TOTAL) {
      setTimeout(showWin, 350);
    } else {
      canCut = true;
      render();
    }
  }, 600);
}

// ═══════════════════════════════════════════
//  WIN / AD
// ═══════════════════════════════════════════
function showWin() {
  document.getElementById('wem').textContent = reward;
  document.getElementById('wh').textContent  = 'Находка внутри!';
  document.getElementById('ws').textContent  = theme.name + ' мыло · Уровень ' + level;
  document.getElementById('win').classList.add('on');
  playTring();
  setTimeout(playTring, 380);
}

function goAd() {
  document.getElementById('win').classList.remove('on');
  document.getElementById('ad').classList.add('on');
  var btn = document.getElementById('adbtn');
  var cnt = document.getElementById('adn');
  btn.classList.remove('on');
  var n = 5; cnt.textContent = n;
  var t = setInterval(function() {
    n--; cnt.textContent = n;
    if (n <= 0) { clearInterval(t); cnt.textContent = '✓'; btn.classList.add('on'); }
  }, 1000);
}

function goNext() {
  document.getElementById('ad').classList.remove('on');
  level++;
  document.getElementById('hlvl').textContent = level;
  initLevel();
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
function initLevel() {
  theme      = THEMES[(level - 1) % THEMES.length];
  reward     = REWARDS[Math.floor(Math.random() * REWARDS.length)];
  layersDone = 0;
  slicePct   = 0;
  canCut     = true;
  active     = false;
  sndTick    = 0;
  render();
}

// START — synchronous, no waiting needed with fixed sizes
initLevel();
