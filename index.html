<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Soap Cutting</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  cursor:none;
  background:#d4bfa0;
  font-family:-apple-system,sans-serif;
  font-weight:700;
}

/* background */
.bg {
  position:fixed; inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,
    #f0e2cc 0%, #d8c4a0 60%, #b89a70 100%);
}

/* ── HUD ── */
#hud {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; gap:10px; padding:12px 14px;
}
.pill {
  background:#fff; border-radius:50px;
  padding:8px 16px; font-size:1rem; color:#333;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
  white-space:nowrap;
}
#bar-wrap {
  flex:1; height:15px; background:rgba(0,0,0,.18);
  border-radius:10px; overflow:hidden;
}
#bar {
  height:100%; width:100%; border-radius:10px;
  background:linear-gradient(90deg,#e65c00,#f9a825);
  transition:width .1s;
}

/* ── SOAP STAGE ── */
#stage {
  position:fixed;
  top:60px; left:0; right:0; bottom:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

/* ── 3D SOAP BOX (CSS 3D) ── */
#soap-scene {
  position:relative;
  /* perspective so 3D works */
  perspective:600px;
  width:220px;
  /* height changes with layers */
}

#soap-box {
  position:relative;
  width:220px;
  transform-style:preserve-3d;
  transform:rotateX(-18deg) rotateY(-28deg);
  transition:height .15s;
}

/* each face */
.face {
  position:absolute;
  width:220px;
}

/* FRONT */
#face-front {
  background:linear-gradient(180deg,#f5ddb0 0%,#c87848 18%,#a05c30 100%);
  border-radius:14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,0.3);
  overflow:hidden;
  /* width & height set by JS */
}
#face-front::after {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 60%);
  border-radius:14px;
  pointer-events:none;
}

/* cut reveal strip at top of front */
#cut-strip {
  position:absolute; top:0; left:0; right:0;
  height:0;
  background:linear-gradient(180deg,#fcefd8,transparent);
  border-radius:14px 14px 0 0;
  pointer-events:none;
  transition:height .05s;
}

/* layer lines */
#layer-lines {
  position:absolute; inset:0; pointer-events:none;
}
.lline {
  position:absolute; left:8px; right:8px;
  height:1.5px;
  background:rgba(0,0,0,0.1);
}

/* TOP face */
#face-top {
  background:linear-gradient(135deg,#fcefd8,#f5ddb0,#fcefd8);
  transform-origin:top center;
  /* positioned at top of front face */
  left:0;
}

/* RIGHT face */
#face-right {
  background:linear-gradient(135deg,#d89060,#a05c30);
  transform-origin:left center;
  left:220px; top:0;
}

/* emoji inside top */
#emoji-reveal {
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
  font-size:0px;
  opacity:0;
  transition:font-size .4s, opacity .4s;
  pointer-events:none;
  z-index:5;
}

/* slab sliding off */
#slab {
  position:absolute;
  left:0; width:220px;
  background:linear-gradient(180deg,#fcefd8,#c87848);
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  box-shadow:2px 2px 8px rgba(0,0,0,.2);
  transition:none;
  overflow:hidden;
}
#slab::after {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,0) 60%);
  border-radius:14px;
}

/* ── KNIFE ── */
#knife {
  position:fixed; z-index:999; pointer-events:none;
  display:none;
  font-size:52px;
  transform:rotate(-40deg) scaleX(-1);
  filter:drop-shadow(2px 4px 8px rgba(0,0,0,.4));
  transform-origin:center center;
  line-height:1;
}

/* ── CHUNK particle ── */
.chunk {
  position:fixed; pointer-events:none; z-index:500;
  border-radius:5px;
  animation:fly var(--t) ease-out forwards;
}
@keyframes fly {
  0%   { opacity:1; transform:translate(0,0)         rotate(0deg)   scale(1); }
  100% { opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.05); }
}

/* ── SCORE POP ── */
.spt {
  position:fixed; z-index:600; pointer-events:none;
  font-size:1.4rem; color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
  animation:sptA .8s ease-out forwards;
}
@keyframes sptA {
  0%   { opacity:1; transform:translateY(0)   scale(1); }
  100% { opacity:0; transform:translateY(-55px) scale(1.2); }
}

/* ── WIN ── */
#win {
  display:none; position:fixed; inset:0; z-index:700;
  background:rgba(0,0,0,.6);
  align-items:center; justify-content:center;
}
#win.on { display:flex; }
.wcard {
  background:linear-gradient(135deg,#fffaf4,#ffe8c4);
  border-radius:28px; padding:36px 44px; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:wpop .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes wpop { from{transform:scale(.3) rotate(-10deg);} to{transform:scale(1) rotate(0);} }
#wem { font-size:5.5rem; display:block; margin-bottom:8px;
  animation:wemb .6s .1s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes wemb { from{transform:scale(0);} to{transform:scale(1);} }
.wh { font-size:1.7rem; color:#333; margin-bottom:4px; }
.ws { color:#aaa; font-size:.9rem; margin-bottom:22px; }
.btn {
  background:linear-gradient(135deg,#e65c00,#f9a825);
  color:#fff; border:none; border-radius:50px;
  padding:13px 40px; font-family:inherit; font-weight:700;
  font-size:1.05rem; cursor:pointer;
  box-shadow:0 6px 20px rgba(230,92,0,.4);
}
.btn:active { transform:scale(.95); }

/* ── AD ── */
#ad {
  display:none; position:fixed; inset:0; z-index:800;
  background:#0f172a; align-items:center; justify-content:center;
}
#ad.on { display:flex; }
.abox {
  background:#1e293b; border:1px solid rgba(255,255,255,.1);
  border-radius:24px; padding:40px; text-align:center;
  width:min(320px,88%);
}
.aico { font-size:3.5rem; display:block; margin-bottom:10px; }
.ah { font-size:1.5rem; color:#fff; margin-bottom:5px; }
.ap { color:rgba(255,255,255,.4); font-size:.85rem; margin-bottom:18px; }
#adn { font-size:2.8rem; color:#f9a825; margin-bottom:14px; }
#adbtn {
  background:linear-gradient(135deg,#e65c00,#f9a825);
  color:#fff; border:none; border-radius:50px;
  padding:13px 34px; font-family:inherit; font-weight:700;
  font-size:1rem; cursor:pointer; opacity:.3; pointer-events:none;
  transition:opacity .3s;
}
#adbtn.on { opacity:1; pointer-events:all; }

#hint {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  color:rgba(0,0,0,.25); font-size:.82rem;
  pointer-events:none; z-index:50; white-space:nowrap;
}
</style>
</head>
<body>

<div class="bg"></div>

<div id="hud">
  <div class="pill">LVL <span id="hlvl">1</span></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div class="pill">⭐ <span id="hscore">0</span></div>
</div>

<div id="stage">
  <div id="soap-scene">
    <div id="soap-box">
      <!-- Faces rendered by JS -->
      <div class="face" id="face-top"></div>
      <div class="face" id="face-right"></div>
      <div class="face" id="face-front">
        <div id="cut-strip"></div>
        <div id="layer-lines"></div>
        <div id="emoji-reveal"></div>
      </div>
    </div>
    <!-- Slab outside box so it can slide independently -->
    <div id="slab"></div>
  </div>
</div>

<div id="knife">🔪</div>

<div id="win">
  <div class="wcard">
    <span id="wem">🌟</span>
    <div class="wh" id="wh">Находка!</div>
    <div class="ws" id="ws">Внутри мыла</div>
    <button class="btn" onclick="doNextLevel()">Следующий →</button>
  </div>
</div>

<div id="ad">
  <div class="abox">
    <span class="aico">📺</span>
    <div class="ah">Реклама</div>
    <div class="ap">Посмотри и продолжи!</div>
    <div id="adn">5</div>
    <button id="adbtn" onclick="skipAd()">Продолжить →</button>
  </div>
</div>

<div id="hint">Веди ножом по мылу ↔</div>

<script>
// ── AUDIO ─────────────────────────────────────
let AC = null;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playScrape() {
  if (!AC) return;
  try {
    const dur = 0.05 + Math.random()*0.04, sr = AC.sampleRate;
    const buf = AC.createBuffer(1, Math.floor(sr*dur), sr);
    const d = buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(i/d.length*Math.PI)*0.5;
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=700+Math.random()*600; f.Q.value=1.5;
    const g=AC.createGain(); g.gain.value=0.25;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(); src.stop(AC.currentTime+dur);
  } catch(e) {}
}
function playPop() {
  if (!AC) return;
  try {
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(300, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, AC.currentTime+0.2);
    g.gain.setValueAtTime(0.4, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+0.25);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.3);
  } catch(e) {}
}
function playTring() {
  if (!AC) return;
  try {
    const t = AC.currentTime;
    [[1047,0],[1319,0.05],[1568,0.1]].forEach(([freq,dl]) => {
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0, t+dl);
      g.gain.linearRampToValueAtTime(0.3, t+dl+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t+dl+1.2);
      o.connect(g); g.connect(AC.destination);
      o.start(t+dl); o.stop(t+dl+1.3);
    });
  } catch(e) {}
}

// ── DATA ──────────────────────────────────────
const THEMES = [
  { front:'linear-gradient(180deg,#f5ddb0 0%,#c87848 18%,#a05c30 100%)',
    top:'linear-gradient(135deg,#fcefd8,#f5ddb0,#fcefd8)',
    right:'linear-gradient(135deg,#d89060,#a05c30)',
    strip:'#fcefd8', chunk:['#c87848','#f5ddb0','#d89060'], name:'Персиковое' },
  { front:'linear-gradient(180deg,#b0d8f5 0%,#3a70c0 18%,#2a5098 100%)',
    top:'linear-gradient(135deg,#d8f0ff,#b0d8f5,#d8f0ff)',
    right:'linear-gradient(135deg,#5090d8,#2a5098)',
    strip:'#d8f0ff', chunk:['#3a70c0','#b0d8f5','#5090d8'], name:'Синее' },
  { front:'linear-gradient(180deg,#b8f0b0 0%,#38a050 18%,#287838 100%)',
    top:'linear-gradient(135deg,#d8ffd0,#b8f0b0,#d8ffd0)',
    right:'linear-gradient(135deg,#58c068,#287838)',
    strip:'#d8ffd0', chunk:['#38a050','#b8f0b0','#58c068'], name:'Мятное' },
  { front:'linear-gradient(180deg,#f5b0c8 0%,#c03870 18%,#982858 100%)',
    top:'linear-gradient(135deg,#ffd8e8,#f5b0c8,#ffd8e8)',
    right:'linear-gradient(135deg,#d85888,#982858)',
    strip:'#ffd8e8', chunk:['#c03870','#f5b0c8','#d85888'], name:'Розовое' },
  { front:'linear-gradient(180deg,#c8b0f5 0%,#7040c0 18%,#502898 100%)',
    top:'linear-gradient(135deg,#e8d8ff,#c8b0f5,#e8d8ff)',
    right:'linear-gradient(135deg,#9060d8,#502898)',
    strip:'#e8d8ff', chunk:['#7040c0','#c8b0f5','#9060d8'], name:'Лавандовое' },
];
const REWARDS = ['😊','🌟','🦋','🌈','🦄','💎','🐉','🌙','🍀','🔮','👑','🎭','🐬','🦊','🐱','🌺'];
const TOTAL = 8;

// ── ELEMENTS ──────────────────────────────────
const $ = id => document.getElementById(id);
const soapBox    = $('soap-box');
const faceFront  = $('face-front');
const faceTop    = $('face-top');
const faceRight  = $('face-right');
const cutStrip   = $('cut-strip');
const layerLines = $('layer-lines');
const emojiEl    = $('emoji-reveal');
const slabEl     = $('slab');
const knifeEl    = $('knife');
const stage      = $('stage');

// ── STATE ─────────────────────────────────────
let level=1, score=0;
let theme, reward;
let layersDone=0, slicePct=0;
let canCut=true, active=false, lastX=0, sndTick=0;

// Soap geometry (in px, computed from screen)
let LAYER_PX = 40;   // height of one layer in px
let SOAP_W   = 200;  // width
let DEPTH_X  = 40;   // right face depth
let DEPTH_Y  = 20;   // top face depth

// ── COMPUTE SIZES ─────────────────────────────
function computeSizes() {
  const stageH = stage.clientHeight || window.innerHeight - 110;
  const stageW = stage.clientWidth  || window.innerWidth;
  SOAP_W   = Math.min(stageW * 0.55, 220);
  DEPTH_X  = Math.round(SOAP_W * 0.20);
  DEPTH_Y  = Math.round(SOAP_W * 0.11);
  // Fit all layers in 70% of stage height
  LAYER_PX = Math.max(24, Math.floor(stageH * 0.70 / TOTAL));
}

// ── APPLY THEME TO DOM ────────────────────────
function applyTheme() {
  faceFront.style.background  = theme.front;
  faceFront.style.width       = SOAP_W + 'px';
  faceTop.style.background    = theme.top;
  faceRight.style.background  = theme.right;
  slabEl.style.background     = theme.front;
  cutStrip.style.background   = `linear-gradient(180deg,${theme.strip},transparent)`;
}

// ── UPDATE DOM GEOMETRY ───────────────────────
function updateDOM() {
  const remaining = TOTAL - layersDone;
  const frontH    = remaining * LAYER_PX;
  const slabH     = Math.round(slicePct * LAYER_PX);

  // soap-box total height = front height + top depth
  soapBox.style.width  = SOAP_W + 'px';
  soapBox.style.height = (frontH + DEPTH_Y) + 'px';

  // FRONT face
  faceFront.style.width  = SOAP_W + 'px';
  faceFront.style.height = frontH + 'px';
  faceFront.style.top    = DEPTH_Y + 'px';
  faceFront.style.left   = '0';
  faceFront.style.transform = '';

  // TOP face (parallelogram via clip-path)
  faceTop.style.width  = SOAP_W + 'px';
  faceTop.style.height = DEPTH_Y + 'px';
  faceTop.style.top    = '0';
  faceTop.style.left   = '0';
  faceTop.style.clipPath =
    `polygon(0 100%, ${DEPTH_X}px 0%, ${SOAP_W+DEPTH_X}px 0%, ${SOAP_W}px 100%)`;
  faceTop.style.background = theme.top;

  // RIGHT face (parallelogram)
  faceRight.style.width  = (DEPTH_X + 4) + 'px';
  faceRight.style.height = (frontH + DEPTH_Y) + 'px';
  faceRight.style.top    = '0';
  faceRight.style.left   = SOAP_W + 'px';
  faceRight.style.clipPath =
    `polygon(0 ${DEPTH_Y}px, ${DEPTH_X}px 0%, ${DEPTH_X+4}px 0%, ${DEPTH_X+4}px ${frontH+DEPTH_Y}px, 0 ${frontH+DEPTH_Y}px)`;
  faceRight.style.background = theme.right;

  // Cut strip (lighter top reveal)
  cutStrip.style.height = (layersDone > 0 || slicePct > 0.05)
    ? Math.round(Math.min(LAYER_PX*0.55, frontH*0.2)) + 'px'
    : '0';

  // Layer lines
  layerLines.innerHTML = '';
  for (let l=1; l<remaining; l++) {
    const div = document.createElement('div');
    div.className = 'lline';
    div.style.top = (l * LAYER_PX) + 'px';
    layerLines.appendChild(div);
  }

  // Emoji reveal on top face
  const pct = layersDone / TOTAL;
  if (layersDone > 0) {
    emojiEl.textContent = reward;
    emojiEl.style.fontSize = Math.round(10 + pct*36) + 'px';
    emojiEl.style.opacity  = Math.min(1, pct*2.5);
    // Position on top face center
    emojiEl.style.top  = (DEPTH_Y/2 - 6) + 'px';
    emojiEl.style.left = (SOAP_W/2 + DEPTH_X/2) + 'px';
    emojiEl.style.transform = 'translate(-50%,-50%)';
    emojiEl.style.position = 'absolute';
  } else {
    emojiEl.style.fontSize = '0';
    emojiEl.style.opacity  = '0';
  }

  // SLAB
  if (slabH > 1 && slicePct < 1) {
    const ox = Math.round(slicePct * 50);
    const oy = Math.round(slicePct * 16);
    slabEl.style.opacity   = '1';
    slabEl.style.width     = SOAP_W + 'px';
    slabEl.style.height    = slabH + 'px';
    slabEl.style.top       = DEPTH_Y + 'px'; // sits just above main block
    slabEl.style.left      = ox + 'px';
    slabEl.style.transform = `translateY(${-slabH + oy}px)`;
  } else {
    slabEl.style.opacity = '0';
  }

  // Progress bar
  const p = Math.max(0, (remaining * LAYER_PX - slicePct*LAYER_PX) / (TOTAL*LAYER_PX));
  $('bar').style.width = (p*100) + '%';
}

// ── INPUT ─────────────────────────────────────
function getXY(e) {
  return e.touches
    ? { x:e.touches[0].clientX, y:e.touches[0].clientY }
    : { x:e.clientX,            y:e.clientY };
}

// Register touch/mouse on the whole stage — easier hit detection
stage.addEventListener('mousedown', e => {
  initAudio(); const p = getXY(e);
  active = true; lastX = p.x;
});
stage.addEventListener('touchstart', e => {
  e.preventDefault(); initAudio(); const p = getXY(e);
  active = true; lastX = p.x;
}, { passive:false });

document.addEventListener('mousemove', e => {
  const p = getXY(e); moveKnife(p.x, p.y);
  if (active && canCut) doCut(p.x, p.y);
});
document.addEventListener('touchmove', e => {
  e.preventDefault(); const p = getXY(e); moveKnife(p.x, p.y);
  if (active && canCut) doCut(p.x, p.y);
}, { passive:false });

document.addEventListener('mouseup',  () => active = false);
document.addEventListener('touchend', () => active = false);
document.addEventListener('mouseleave', () => {
  active = false; knifeEl.style.display = 'none';
});

function moveKnife(x, y) {
  knifeEl.style.display = 'block';
  knifeEl.style.left = (x - 30) + 'px';
  knifeEl.style.top  = (y - 50) + 'px';
}

function doCut(x, y) {
  const dx = Math.abs(x - lastX);
  if (dx < 1.5) return;
  lastX = x;

  slicePct = Math.min(1, slicePct + dx * 0.009);

  sndTick++;
  if (sndTick % 3 === 0) playScrape();

  if (Math.random() < 0.5) spawnChunk(x, y, false);

  updateDOM();

  if (slicePct >= 1) finishLayer(x, y);
}

// ── PARTICLES ─────────────────────────────────
function spawnChunk(x, y, big) {
  const n = big ? 5 : 1;
  for (let i=0; i<n; i++) {
    const el = document.createElement('div');
    el.className = 'chunk';
    const s   = big ? 8+Math.random()*18 : 4+Math.random()*10;
    const col = theme.chunk[Math.floor(Math.random()*theme.chunk.length)];
    el.style.cssText = `width:${s}px;height:${s*(0.4+Math.random()*.8)}px;`
      + `left:${x-s/2}px;top:${y-s/2}px;background:${col};`
      + `border-radius:${Math.random()>.4?'50%':'4px'};`;
    const ang = -0.5 + (Math.random()-.5)*2.2;
    const d   = (big?55:25) + Math.random()*90;
    el.style.setProperty('--x', Math.cos(ang)*d + 'px');
    el.style.setProperty('--y', Math.sin(ang)*d + 30 + Math.random()*30 + 'px');
    el.style.setProperty('--r', (Math.random()*500-250) + 'deg');
    const t = 0.4 + Math.random()*0.5;
    el.style.setProperty('--t', t + 's');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), t*1000+100);
  }
}

function scorePop(txt, x, y) {
  const el = document.createElement('div');
  el.className = 'spt'; el.textContent = txt;
  el.style.left = x+'px'; el.style.top = y+'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ── FINISH LAYER ──────────────────────────────
function finishLayer(px, py) {
  canCut = false; active = false;
  playPop();
  for (let i=0; i<22; i++)
    setTimeout(() => spawnChunk(px+(Math.random()-.5)*180, py+(Math.random()-.5)*60, true), i*28);
  const pts = 50 + layersDone*12;
  score += pts; $('hscore').textContent = score;
  scorePop('+'+pts, px, py-36);
  setTimeout(() => {
    layersDone++; slicePct = 0; updateDOM();
