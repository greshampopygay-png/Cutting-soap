<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🧼 Soap Cutting</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;
  touch-action:none;user-select:none;cursor:none;
  font-family:-apple-system,sans-serif;font-weight:700;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#f0e2cc,#d8c4a0 55%,#b89a70);
}
/* HUD */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:8px;padding:10px 12px;
}
.pill{
  background:#fff;border-radius:50px;padding:7px 14px;
  font-size:.95rem;color:#333;
  box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap;
}
#bar-wrap{flex:1;height:13px;background:rgba(0,0,0,.18);border-radius:10px;overflow:hidden;}
#bar{height:100%;border-radius:10px;background:linear-gradient(90deg,#e65c00,#f9a825);width:100%;}

/* STAGE — fills screen below HUD */
#stage{
  position:fixed;top:56px;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}

/* SOAP wrapper — inline-block so it sizes to content */
#soap-wrap{
  display:inline-block;
  position:relative;
}

/* Chunks */
.ck{position:fixed;pointer-events:none;z-index:500;border-radius:5px;
  animation:ckfly .6s ease-out forwards;}
@keyframes ckfly{
  0%{opacity:1;transform:translate(0,0)rotate(0)scale(1);}
  100%{opacity:0;transform:translate(var(--x),var(--y))rotate(var(--r))scale(.05);}
}
/* Score pop */
.spt{position:fixed;z-index:600;pointer-events:none;font-size:1.3rem;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.5);animation:sptA .8s ease-out forwards;}
@keyframes sptA{
  0%{opacity:1;transform:translateY(0)scale(1);}
  100%{opacity:0;transform:translateY(-55px)scale(1.2);}
}

/* KNIFE */
#knife{position:fixed;z-index:999;pointer-events:none;display:none;
  font-size:48px;line-height:1;
  transform:rotate(-38deg) scaleX(-1);
  filter:drop-shadow(2px 4px 8px rgba(0,0,0,.4));}

/* BOTTOM BUTTONS */
#btns{
  position:fixed;bottom:12px;left:10px;z-index:200;
  display:flex;flex-direction:column;gap:7px;
}
.bb{
  border-radius:50px;padding:9px 16px;font-size:.82rem;
  box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  border:none;font-family:inherit;font-weight:700;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.bb:active{transform:scale(.93);}
.bb-gold{background:linear-gradient(135deg,#f9a825,#e65c00);color:#fff;}
.bb-blue{background:linear-gradient(135deg,#42a5f5,#1565c0);color:#fff;}
.bb-green{background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff;}

/* Hint */
#hint{position:fixed;bottom:18px;right:12px;color:rgba(0,0,0,.25);
  font-size:.78rem;pointer-events:none;z-index:50;white-space:nowrap;}

/* Toast */
#toast{position:fixed;bottom:165px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.65);color:#fff;padding:7px 18px;border-radius:50px;
  font-size:.78rem;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;}
#toast.show{opacity:1;}

/* WIN */
#win{display:none;position:fixed;inset:0;z-index:700;
  background:rgba(0,0,0,.6);align-items:center;justify-content:center;}
#win.on{display:flex;}
.wcard{background:linear-gradient(135deg,#fffaf4,#ffe8c4);border-radius:26px;
  padding:34px 42px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:wpop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes wpop{from{transform:scale(.3)rotate(-10deg);}to{transform:scale(1)rotate(0);}}
#wem{font-size:5rem;display:block;margin-bottom:8px;
  animation:eb .6s .1s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes eb{from{transform:scale(0);}to{transform:scale(1);}}
.wh{font-size:1.6rem;color:#333;margin-bottom:4px;}
.ws{color:#aaa;font-size:.88rem;margin-bottom:20px;}
.wbtn{background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;border:none;
  border-radius:50px;padding:13px 38px;font-family:inherit;font-weight:700;
  font-size:1rem;cursor:pointer;}
.wbtn:active{transform:scale(.95);}

/* AD */
#ad{display:none;position:fixed;inset:0;z-index:800;
  background:rgba(0,0,0,.88);align-items:center;justify-content:center;}
#ad.on{display:flex;}
.abox{background:#1e293b;border:1px solid rgba(255,255,255,.1);border-radius:22px;
  padding:36px;text-align:center;width:min(310px,88%);}
.aico{font-size:3rem;display:block;margin-bottom:10px;}
.ah{font-size:1.4rem;color:#fff;margin-bottom:5px;}
.ap{color:rgba(255,255,255,.4);font-size:.82rem;margin-bottom:16px;}
#adn{font-size:2.8rem;color:#f9a825;margin-bottom:14px;font-weight:900;}
#adbtn{background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;border:none;
  border-radius:50px;padding:12px 30px;font-family:inherit;font-weight:700;
  font-size:.95rem;cursor:pointer;opacity:.3;pointer-events:none;transition:opacity .3s;}
#adbtn.on{opacity:1;pointer-events:all;}

/* COLLECTION */
#cpanel{display:none;position:fixed;inset:0;z-index:900;
  background:rgba(0,0,0,.75);align-items:center;justify-content:center;}
#cpanel.on{display:flex;}
.cbox{background:#fff;border-radius:22px;width:min(360px,94%);
  max-height:82vh;display:flex;flex-direction:column;overflow:hidden;}
.chead{display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;border-bottom:1px solid #f0f0f0;flex-shrink:0;}
.chead h2{font-size:1.2rem;color:#333;margin:0;}
.cclose{width:34px;height:34px;border-radius:50%;background:#f0f0f0;
  border:none;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-weight:900;}
.cclose:active{background:#ddd;}
.cstats{padding:8px 18px 0;font-size:.82rem;color:#999;flex-shrink:0;}
.cgrid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;
  padding:12px 14px 18px;overflow-y:auto;flex:1;}
.ci{width:54px;height:54px;border-radius:14px;background:#f5f5f5;border:2px solid #eee;
  display:flex;align-items:center;justify-content:center;font-size:1.75rem;
  position:relative;box-shadow:0 2px 6px rgba(0,0,0,.07);}
.ci.found{background:linear-gradient(135deg,#fff9f0,#fff3e0);border:2px solid #f9a825;}
.ci.locked{filter:grayscale(1);opacity:.22;}
.ci .chk{position:absolute;bottom:2px;right:2px;font-size:.5rem;
  background:#4caf50;color:#fff;border-radius:50%;width:13px;height:13px;
  display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>

</div>

<script>
// ── AUDIO ─────────────────────────────────────────────────
var AC = null;
function ua() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function scrape() {
  if (!AC) return;
  try {
    var dur = 0.06, sr = AC.sampleRate;
    var buf = AC.createBuffer(1, Math.floor(sr*dur), sr);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++)
      d[i] = (Math.random()*2-1) * Math.sin(i/d.length*3.14) * 0.5;
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 700 + Math.random()*500;
    var g = AC.createGain(); g.gain.value = 0.2;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(); src.stop(AC.currentTime + dur);
  } catch(e) {}
}
function pop() {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(300, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, AC.currentTime + 0.2);
    g.gain.setValueAtTime(0.4, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.25);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.3);
  } catch(e) {}
}
function tring() {
  if (!AC) return;
  try {
    var t = AC.currentTime;
    [[1047,0],[1319,0.05],[1568,0.1]].forEach(function(p) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = p[0];
      g.gain.setValueAtTime(0, t+p[1]);
      g.gain.linearRampToValueAtTime(0.25, t+p[1]+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t+p[1]+1.1);
      o.connect(g); g.connect(AC.destination);
      o.start(t+p[1]); o.stop(t+p[1]+1.2);
    });
  } catch(e) {}
}

// ── DATA ──────────────────────────────────────────────────
var TH = [
  {n:'Персиковое', f:'linear-gradient(180deg,#fcefd8 0%,#c87848 15%,#904020 100%)',t:'#fcefd8',r:'linear-gradient(180deg,#d89060,#905028)',s:'linear-gradient(180deg,#fcefd8,#c87848)',c:['#c87848','#f5ddb0','#d89060']},
  {n:'Синее',      f:'linear-gradient(180deg,#d8f0ff 0%,#3a70c0 15%,#1a4890 100%)',t:'#d8f0ff',r:'linear-gradient(180deg,#5090d8,#2a5098)',s:'linear-gradient(180deg,#d8f0ff,#3a70c0)',c:['#3a70c0','#b0d8f5','#5090d8']},
  {n:'Мятное',     f:'linear-gradient(180deg,#d8ffd0 0%,#38a050 15%,#186830 100%)',t:'#d8ffd0',r:'linear-gradient(180deg,#58c068,#287838)',s:'linear-gradient(180deg,#d8ffd0,#38a050)',c:['#38a050','#b8f0b0','#58c068']},
  {n:'Розовое',    f:'linear-gradient(180deg,#ffd8e8 0%,#c03870 15%,#801850 100%)',t:'#ffd8e8',r:'linear-gradient(180deg,#d85888,#982858)',s:'linear-gradient(180deg,#ffd8e8,#c03870)',c:['#c03870','#f5b0c8','#d85888']},
  {n:'Лавандовое', f:'linear-gradient(180deg,#e8d8ff 0%,#7040c0 15%,#401890 100%)',t:'#e8d8ff',r:'linear-gradient(180deg,#9060d8,#502898)',s:'linear-gradient(180deg,#e8d8ff,#7040c0)',c:['#7040c0','#c8b0f5','#9060d8']},
  {n:'Шоколадное', f:'linear-gradient(180deg,#f5dcc0 0%,#7a4020 15%,#4a2010 100%)',t:'#f5dcc0',r:'linear-gradient(180deg,#a06030,#603010)',s:'linear-gradient(180deg,#f5dcc0,#7a4020)',c:['#7a4020','#c09060','#a06030']},
  {n:'Красное',    f:'linear-gradient(180deg,#ffe0d8 0%,#d03020 15%,#901010 100%)',t:'#ffe0d8',r:'linear-gradient(180deg,#e05040,#a01818)',s:'linear-gradient(180deg,#ffe0d8,#d03020)',c:['#d03020','#f09080','#e05040']},
  {n:'Жёлтое',     f:'linear-gradient(180deg,#fffbd0 0%,#d4a800 15%,#9a7800 100%)',t:'#fffbd0',r:'linear-gradient(180deg,#f0c820,#b08800)',s:'linear-gradient(180deg,#fffbd0,#d4a800)',c:['#d4a800','#f5e080','#f0c820']},
  {n:'Бирюзовое',  f:'linear-gradient(180deg,#d0fff8 0%,#20a890 15%,#107860 100%)',t:'#d0fff8',r:'linear-gradient(180deg,#30c8a8,#108868)',s:'linear-gradient(180deg,#d0fff8,#20a890)',c:['#20a890','#90e8d8','#30c8a8']},
  {n:'Оранжевое',  f:'linear-gradient(180deg,#fff0d0 0%,#e87020 15%,#a04010 100%)',t:'#fff0d0',r:'linear-gradient(180deg,#f09040,#b05018)',s:'linear-gradient(180deg,#fff0d0,#e87020)',c:['#e87020','#f8c080','#f09040']},
  {n:'Изумрудное', f:'linear-gradient(180deg,#d0ffe8 0%,#208858 15%,#105830 100%)',t:'#d0ffe8',r:'linear-gradient(180deg,#30b870,#106840)',s:'linear-gradient(180deg,#d0ffe8,#208858)',c:['#208858','#80e0b0','#30b870']},
  {n:'Сиреневое',  f:'linear-gradient(180deg,#f8d8ff 0%,#b040d0 15%,#801090 100%)',t:'#f8d8ff',r:'linear-gradient(180deg,#d060e8,#9010a0)',s:'linear-gradient(180deg,#f8d8ff,#b040d0)',c:['#b040d0','#e090f0','#d060e8']},
  {n:'Серебряное', f:'linear-gradient(180deg,#f0f4f8 0%,#8090a8 15%,#506070 100%)',t:'#f0f4f8',r:'linear-gradient(180deg,#a0b0c0,#607080)',s:'linear-gradient(180deg,#f0f4f8,#8090a8)',c:['#8090a8','#c0d0e0','#a0b0c0']},
  {n:'Золотое',    f:'linear-gradient(180deg,#fff8d0 0%,#c89800 15%,#886800 100%)',t:'#fff8d0',r:'linear-gradient(180deg,#e0b820,#a07800)',s:'linear-gradient(180deg,#fff8d0,#c89800)',c:['#c89800','#f0d860','#e0b820']},
  {n:'Радужное',   f:'linear-gradient(180deg,#ffd0d0 0%,#d080c0 33%,#8080d0 66%,#80c0d0 100%)',t:'#ffd0e8',r:'linear-gradient(180deg,#d080c0,#8080d0)',s:'linear-gradient(180deg,#ffd0d0,#d080c0)',c:['#d080c0','#80c0d0','#f0a0d0']},
];
var RW = [
  '😊','🌟','🦋','🌈','🦄','💎','🐉','🌙','🍀','🔮',
  '👑','🎭','🐬','🦊','🐱','🌺','🔥','🍭','🎀','🐠',
  '🦁','🐯','🐸','🦜','🦩','🌸','🍓','🍇','🍉','🎸',
  '🎺','🎻','🎹','🥁','🎨','🎪','🎠','🎡','🎢','🚀',
  '🛸','🌍','🌊','🏔️','🌋','🦅','🐙','🦑','🐡','🦈',
];

var TOTAL = 8;
var LH = 38;    // px height of one layer
var SW = 200;   // soap front width
var DX = 36;    // right-face depth x
var DY = 18;    // top-face depth y

// ── STATE ─────────────────────────────────────────────────
var level = 1, score = 0, coll = [];
var th = TH[0], rw = '😊';
var done = 0, pct = 0, canCut = true, active = false, lastX = 0, stk = 0;

// ── SAVE / LOAD ───────────────────────────────────────────
function save() {
  try {
    localStorage.setItem('sc_l', level);
    localStorage.setItem('sc_s', score);
    localStorage.setItem('sc_c', JSON.stringify(coll));
    var t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 1800);
  } catch(e) {}
}
function load() {
  try {
    var l = localStorage.getItem('sc_l');
    var s = localStorage.getItem('sc_s');
    var c = localStorage.getItem('sc_c');
    if (l) level = parseInt(l) || 1;
    if (s) score = parseInt(s) || 0;
    if (c) coll  = JSON.parse(c) || [];
  } catch(e) {}
}
document.addEventListener('visibilitychange', function() { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

// ── BUILD SOAP DOM ────────────────────────────────────────
// We build the soap once as DOM nodes, then just change styles in render()
var wrap = document.getElementById('soap-wrap');

// Top face (parallelogram via skew)
var elTop = document.createElement('div');
elTop.id = 'el-top';
elTop.style.cssText = [
  'height:' + DY + 'px',
  'margin-left:0',
  'margin-bottom:0',
  'position:relative',
].join(';');
wrap.appendChild(elTop);

// Row: front + right side by side
var elRow = document.createElement('div');
elRow.style.cssText = 'display:flex;align-items:stretch;position:relative;';
wrap.appendChild(elRow);

// Front face
var elFront = document.createElement('div');
elFront.id = 'el-front';
elFront.style.cssText = [
  'width:' + SW + 'px',
  'border-radius:14px',
  'overflow:hidden',
  'position:relative',
  'box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.3)',
  'flex-shrink:0',
].join(';');
elRow.appendChild(elFront);

// Shine overlay inside front
var elShine = document.createElement('div');
elShine.style.cssText = [
  'position:absolute',
  'inset:0',
  'background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,0) 55%)',
  'pointer-events:none',
  'border-radius:14px',
].join(';');
elFront.appendChild(elShine);

// Cut strip inside front
var elStrip = document.createElement('div');
elStrip.style.cssText = 'position:absolute;top:0;left:0;right:0;height:0;pointer-events:none;';
elFront.appendChild(elStrip);

// Layer lines container
var elLines = document.createElement('div');
elLines.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
elFront.appendChild(elLines);

// Emoji reveal
var elEmoji = document.createElement('div');
elEmoji.style.cssText = [
  'position:absolute',
  'left:50%',
  'top:50%',
  'transform:translate(-50%,-50%)',
  'font-size:0',
  'opacity:0',
  'pointer-events:none',
  'transition:font-size .3s,opacity .3s',
].join(';');
elFront.appendChild(elEmoji);

// Right face
var elRight = document.createElement('div');
elRight.id = 'el-right';
elRight.style.cssText = [
  'width:' + DX + 'px',
  'flex-shrink:0',
  'border-radius:0 6px 6px 0',
].join(';');
elRow.appendChild(elRight);

// Slab (positioned absolutely over the top of front)
var elSlab = document.createElement('div');
elSlab.style.cssText = [
  'position:absolute',
  'width:' + SW + 'px',
  'opacity:0',
  'pointer-events:none',
  'border-radius:11px',
  'box-shadow:2px 2px 8px rgba(0,0,0,.18)',
  'overflow:hidden',
].join(';');
wrap.insertBefore(elSlab, elRow); // before the row so it appears on top via z-index
elSlab.style.zIndex = '5';

// Shadow
var elShadow = document.createElement('div');
elShadow.style.cssText = [
  'height:16px',
  'margin:6px auto 0',
  'background:radial-gradient(ellipse,rgba(0,0,0,.18) 0%,transparent 70%)',
  'border-radius:50%',
].join(';');
wrap.appendChild(elShadow);

// ── RENDER ────────────────────────────────────────────────
function render() {
  var rem  = TOTAL - done;
  var fh   = rem * LH;          // front face height
  var slH  = Math.round(pct * LH);
  var slOX = Math.round(pct * 46);
  var slOY = Math.round(pct * 14);

  // Top face
  elTop.style.background = th.t;
  elTop.style.width      = (SW + DX) + 'px';
  elTop.style.height     = DY + 'px';
  elTop.style.clipPath   = 'polygon(' + DX + 'px 0,' + (SW+DX) + 'px 0,' + SW + 'px ' + DY + 'px,0 ' + DY + 'px)';

  // Front face height + background
  elFront.style.height     = fh + 'px';
  elFront.style.background = th.f;

  // Right face
  elRight.style.height     = fh + 'px';
  elRight.style.background = th.r;
  elRight.style.clipPath   = 'polygon(0 0,' + DX + 'px -' + DY + 'px,' + DX + 'px ' + (fh-DY) + 'px,0 ' + fh + 'px)';

  // Cut strip
  var stH = (done > 0 || pct > 0.05) ? Math.round(Math.min(LH*0.5, fh*0.2)) : 0;
  elStrip.style.height     = stH + 'px';

  var ep = done / TOTAL;
  if (done > 0) {
    elEmoji.textContent     = rw;
    elEmoji.style.fontSize  = Math.round(10 + ep*32) + 'px';
    elEmoji.style.opacity   = Math.min(1, ep*2.5);
  } else {
    elEmoji.style.fontSize  = '0';
    elEmoji.style.opacity   = '0';
  }

  // Slab
  if (slH > 1 && pct < 1) {
    elSlab.style.opacity    = '1';
    elSlab.style.height     = slH + 'px';
    elSlab.style.background = th.s;
    // position slab just above the front face top
    elSlab.style.position   = 'absolute';
    elSlab.style.top        = (DY - slH + slOY) + 'px';
    elSlab.style.left       = slOX + 'px';
    elSlab.style.zIndex     = '10';
  } else {
    elSlab.style.opacity = '0';
  }

  // Shadow width
  elShadow.style.width = Math.round(SW * 0.85) + 'px';

  // Progress bar
  var bp = Math.max(0, (rem*LH - pct*LH) / (TOTAL*LH));
  document.getElementById('bar').style.width = (bp*100) + '%';
}
