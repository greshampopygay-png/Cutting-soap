<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Soap Cutting</title>
<style>
/* No Google Fonts – use system fonts so it works offline/GitHub Pages */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%; height:100%;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  cursor:none;
  font-family: -apple-system, 'Segoe UI', sans-serif;
  font-weight:700;
  background:#c8b89a;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:radial-gradient(ellipse 90% 70% at 50% 38%,
    #f0e4d0 0%,#d8c8a8 55%,#b8a070 100%);
  z-index:0;
}

/* HUD */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;gap:10px;padding:14px 16px;
}
.pill{
  background:rgba(255,255,255,.92);border-radius:50px;
  padding:8px 18px;font-size:1rem;color:#333;
  box-shadow:0 3px 10px rgba(0,0,0,.15);white-space:nowrap;
}
#bar-wrap{
  flex:1;height:16px;background:rgba(0,0,0,.18);
  border-radius:10px;overflow:hidden;
}
#bar{
  height:100%;border-radius:10px;width:100%;
  background:linear-gradient(90deg,#e65c00,#f9a825);
  transition:width .12s;
}

/* Canvas fills the screen */
#gameCanvas{
  position:fixed;
  top:0;left:0;
  z-index:10;
  display:block;
  /* no width/height here — set via JS */
}

/* Knife cursor */
#knife-wrap{
  position:fixed;z-index:9999;pointer-events:none;display:none;
  width:190px;height:42px;
}

/* Flying chunk */
.ck{
  position:fixed;pointer-events:none;z-index:500;
  animation:ckfly var(--t) ease-out forwards;
}
@keyframes ckfly{
  0%  {opacity:1;transform:translate(0,0)rotate(0)scale(1);}
  100%{opacity:0;transform:translate(var(--x),var(--y))rotate(var(--r))scale(.05);}
}

/* Score popup */
.spt{
  position:fixed;z-index:600;pointer-events:none;
  font-size:1.4rem;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
  animation:sptA .8s ease-out forwards;
}
@keyframes sptA{
  0%  {opacity:1;transform:translateY(0)scale(1);}
  100%{opacity:0;transform:translateY(-60px)scale(1.2);}
}

/* WIN */
#win{
  display:none;position:fixed;inset:0;z-index:700;
  background:rgba(0,0,0,.65);
  align-items:center;justify-content:center;
}
#win.on{display:flex;}
.wcard{
  background:linear-gradient(135deg,#fffaf4,#ffe8c4);
  border-radius:32px;padding:44px 52px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
  animation:cpop .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cpop{from{transform:scale(.3)rotate(-12deg);}to{transform:scale(1)rotate(0);}}
#wemoji{font-size:6rem;display:block;margin-bottom:10px;
  animation:eb .6s .15s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes eb{from{transform:scale(0);}to{transform:scale(1);}}
.wh{font-size:1.9rem;color:#333;margin-bottom:5px;}
.ws{color:#999;font-size:.95rem;margin-bottom:26px;}
.btn{
  background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;
  border:none;border-radius:50px;padding:14px 44px;
  font-family:inherit;font-weight:700;font-size:1.1rem;
  cursor:pointer;box-shadow:0 8px 28px rgba(230,92,0,.45);
  transition:transform .12s;
}
.btn:active{transform:scale(.94);}

/* AD */
#ad{
  display:none;position:fixed;inset:0;z-index:800;
  background:#0f172a;align-items:center;justify-content:center;
}
#ad.on{display:flex;}
.abox{
  background:#1e293b;border:1px solid rgba(255,255,255,.1);
  border-radius:28px;padding:44px;text-align:center;
  width:min(340px,90%);
}
.aico{font-size:4rem;display:block;margin-bottom:12px;}
.ah{font-size:1.65rem;color:#fff;margin-bottom:6px;}
.ap{color:rgba(255,255,255,.45);font-size:.9rem;margin-bottom:22px;}
#adn{font-size:3rem;color:#f9a825;margin-bottom:18px;}
#adbtn{
  background:linear-gradient(135deg,#e65c00,#f9a825);color:#fff;
  border:none;border-radius:50px;padding:14px 38px;
  font-family:inherit;font-weight:700;font-size:1.1rem;
  cursor:pointer;opacity:.3;pointer-events:none;
  transition:opacity .3s,box-shadow .3s;
}
#adbtn.on{opacity:1;pointer-events:all;box-shadow:0 8px 28px rgba(230,92,0,.5);}

#hint{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  color:rgba(0,0,0,.3);font-size:.85rem;
  pointer-events:none;white-space:nowrap;z-index:50;
}
</style>
</head>
<body>

<div id="hud">
  <div class="pill">LVL <span id="hlvl">1</span></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div class="pill">⭐ <span id="hscore">0</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<!-- Knife SVG -->
<div id="knife-wrap">
  <svg viewBox="0 0 190 42" fill="none" xmlns="http://www.w3.org/2000/svg"
       width="190" height="42">
    <path d="M28 26 L170 10 L180 17 L170 26Z" fill="url(#bl)"/>
    <path d="M28 26 L170 10" stroke="rgba(255,255,255,.9)"
          stroke-width="1.5" stroke-linecap="round"/>
    <path d="M170 10 L182 14 L170 26Z" fill="#b0c0cc"/>
    <rect x="18" y="20" width="14" height="12" rx="3" fill="#5a6068"/>
    <rect x="2"  y="21" width="24" height="10" rx="4" fill="url(#hl)"/>
    <circle cx="9"  cy="26" r="2" fill="#c8a060"/>
    <circle cx="18" cy="26" r="2" fill="#c8a060"/>
    <defs>
      <linearGradient id="bl" x1="28" y1="18" x2="180" y2="18"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#c0ccd8"/>
        <stop offset="45%"  stop-color="#edf4f8"/>
        <stop offset="100%" stop-color="#d0dce8"/>
      </linearGradient>
      <linearGradient id="hl" x1="2" y1="21" x2="2" y2="31"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0%"   stop-color="#8b5e3c"/>
        <stop offset="100%" stop-color="#4a2e14"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<!-- Win screen -->
<div id="win">
  <div class="wcard">
    <span id="wemoji">🌟</span>
    <div class="wh" id="wh">Находка!</div>
    <div class="ws" id="ws">Внутри мыла</div>
    <button class="btn" onclick="doNextLevel()">Следующий →</button>
  </div>
</div>

<!-- Ad screen -->
<div id="ad">
  <div class="abox">
    <span class="aico">📺</span>
    <div class="ah">Реклама</div>
    <div class="ap">Посмотри и продолжи игру!</div>
    <div id="adn">5</div>
    <button id="adbtn" onclick="skipAd()">Продолжить →</button>
  </div>
</div>

<div id="hint">Веди ножом по мылу ↔</div>

<script>
// ═══════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {}
}

function playScrape() {
  if (!audioCtx) return;
  try {
    const dur  = 0.06 + Math.random() * 0.04;
    const sr   = audioCtx.sampleRate;
    const buf  = audioCtx.createBuffer(1, Math.floor(sr * dur), sr);
    const d    = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      d[i] = (Math.random()*2-1) * Math.sin(i/d.length*Math.PI) * 0.5;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bpf = audioCtx.createBiquadFilter();
    bpf.type = 'bandpass';
    bpf.frequency.value = 800 + Math.random()*500;
    bpf.Q.value = 1.5;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.3;
    src.connect(bpf); bpf.connect(gain); gain.connect(audioCtx.destination);
    src.start(); src.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

function playPop() {
  if (!audioCtx) return;
  try {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime+0.2);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.25);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+0.3);
  } catch(e) {}
}

// ═══════════════════════════════════════════
// THEMES & REWARDS
// ═══════════════════════════════════════════
const THEMES = [
  { top:'#f5ddb0', topH:'#fcefd8', side:'#c87848', sideD:'#a05c30', sideR:'#d89060', name:'Персиковое' },
  { top:'#b0d8f5', topH:'#d8f0ff', side:'#3a70c0', sideD:'#2a5098', sideR:'#5090d8', name:'Синее'      },
  { top:'#b8f0b0', topH:'#d8ffd0', side:'#38a050', sideD:'#287838', sideR:'#58c068', name:'Мятное'     },
  { top:'#f5b0c8', topH:'#ffd8e8', side:'#c03870', sideD:'#982858', sideR:'#d85888', name:'Розовое'    },
  { top:'#c8b0f5', topH:'#e8d8ff', side:'#7040c0', sideD:'#502898', sideR:'#9060d8', name:'Лавандовое' },
];
const REWARDS = ['😊','🌟','🦋','🌈','🦄','💎','🐉','🌙','🍀','🔮','👑','🎭','🐬','🦊','🐱','🌺'];

// ═══════════════════════════════════════════
// CANVAS — size set AFTER page load
// ═══════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// All geometry stored as vars (not const) so we can recalc on resize
let VW, VH, CX, CY, SW, SH_UNIT, DEPTH_X, DEPTH_Y, FULL_H;
const TOTAL_LAYERS = 8;

function setupSize() {
  VW = window.innerWidth;
  VH = window.innerHeight;
  canvas.width  = VW;
  canvas.height = VH;
  canvas.style.width  = VW + 'px';
  canvas.style.height = VH + 'px';

  CX = VW / 2;
  CY = VH * 0.52;        // vertical center of soap

  // Make soap big enough to fill phone screen nicely
  SW       = Math.min(VW * 0.70, 320);   // front face width
  SH_UNIT  = Math.round(VH * 0.048);     // height of ONE layer  (~4.8% screen height)
  DEPTH_X  = SW * 0.20;
  DEPTH_Y  = -SW * 0.11;
  FULL_H   = TOTAL_LAYERS * SH_UNIT;
}

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let level      = 1;
let score      = 0;
let theme, reward;
let layersDone = 0;
let slicePct   = 0;
let canCut     = true;
let active     = false;
let lastX      = 0;
let sndTick    = 0;

const knifeWrap = document.getElementById('knife-wrap');

// ═══════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════
function draw() {
  ctx.clearRect(0, 0, VW, VH);

  const remaining = TOTAL_LAYERS - layersDone;
  if (remaining <= 0) return;

  const mainH = remaining * SH_UNIT - slicePct * SH_UNIT;
  const slabH = slicePct * SH_UNIT;

  const fL = CX - SW / 2;
  const fR = CX + SW / 2;
  const fB = CY + mainH / 2;
  const fT = fB - mainH;

  // Ground shadow
  {
    const gx = CX + DEPTH_X * 0.4;
    const gy = fB + 22;
    const grd = ctx.createRadialGradient(gx, gy, 4, gx, gy, SW * 0.55);
    grd.addColorStop(0, 'rgba(0,0,0,0.22)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.scale(1, 0.4);
    ctx.beginPath();
    ctx.arc(gx, gy / 0.4, SW * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.restore();
  }

  // ── RIGHT side face ──
  {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(fR,         fB);
    ctx.lineTo(fR+DEPTH_X, fB+DEPTH_Y);
    ctx.lineTo(fR+DEPTH_X, fT+DEPTH_Y);
    ctx.lineTo(fR,         fT);
    ctx.closePath();
    const rg = ctx.createLinearGradient(fR, fT, fR+DEPTH_X, fT+DEPTH_Y);
    rg.addColorStop(0, theme.sideR);
    rg.addColorStop(1, theme.sideD);
    ctx.fillStyle = rg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.07)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Layer lines on right face
    for (let l = 1; l < remaining; l++) {
      const ly = fB - l * SH_UNIT;
      if (ly < fT) continue;
      ctx.beginPath();
      ctx.moveTo(fR,         ly);
      ctx.lineTo(fR+DEPTH_X, ly+DEPTH_Y);
      ctx.strokeStyle = 'rgba(0,0,0,0.13)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  // ── TOP face ──
  {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(fL,         fT);
    ctx.lineTo(fR,         fT);
    ctx.lineTo(fR+DEPTH_X, fT+DEPTH_Y);
    ctx.lineTo(fL+DEPTH_X, fT+DEPTH_Y);
    ctx.closePath();
    const tg = ctx.createLinearGradient(fL, fT, fR+DEPTH_X, fT+DEPTH_Y);
    tg.addColorStop(0, theme.topH);
    tg.addColorStop(0.5, theme.top);
    tg.addColorStop(1, theme.topH);
    ctx.fillStyle = tg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.06)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Top shine
    const scx = fL + (fR - fL) * 0.3 + DEPTH_X * 0.3;
    const scy = fT + DEPTH_Y * 0.4;
    const sg = ctx.createRadialGradient(scx, scy, 2, scx, scy, SW * 0.4);
    sg.addColorStop(0, 'rgba(255,255,255,.6)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fill();

    // Emoji reveal on top
    if (layersDone > 0) {
      const pct = layersDone / TOTAL_LAYERS;
      const ecx = CX + DEPTH_X * 0.35;
      const ecy = fT + DEPTH_Y * 0.45;
      ctx.globalAlpha = Math.min(1, pct * 2.5);
      ctx.font = `${Math.round(10 + pct * 38)}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(reward, ecx, ecy);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // ── FRONT face ──
  {
    const R = Math.min(20, SW * 0.07, mainH * 0.25);
    ctx.save();
    rrect(ctx, fL, fT, SW, mainH, R);
    ctx.clip();

    // Base fill
    const fg = ctx.createLinearGradient(fL, fT, fL, fB);
    fg.addColorStop(0, theme.top);
    fg.addColorStop(0.18, theme.side);
    fg.addColorStop(1, theme.sideD);
    ctx.fillStyle = fg;
    ctx.fill();

    // Inner lighter reveal at cut top
    if (layersDone > 0 || slicePct > 0.05) {
      const ih = Math.min(SH_UNIT * 0.65, mainH * 0.22);
      const ig = ctx.createLinearGradient(0, fT, 0, fT + ih);
      ig.addColorStop(0, theme.topH);
      ig.addColorStop(1, theme.top + '00');
      ctx.fillStyle = ig;
      ctx.fillRect(fL, fT, SW, ih);
    }

    // Bubble texture
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 14; i++) {
      const bx = fL + pr(i*7) * SW;
      const by = fT + pr(i*13) * mainH;
      const br = 5 + pr(i*3) * 12;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Front shine
    const shg = ctx.createLinearGradient(fL, fT, fL + SW*0.3, fT + mainH*0.4);
    shg.addColorStop(0, 'rgba(255,255,255,0.25)');
    shg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shg;
    ctx.fillRect(fL, fT, SW, mainH);

    // Layer lines on front face
    for (let l = 1; l < remaining; l++) {
      const ly = fB - l * SH_UNIT;
      if (ly < fT || ly > fB) continue;
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(fL + R, ly);
      ctx.lineTo(fR - R, ly);
      ctx.stroke();
    }
    ctx.restore();

    // Front outline
    ctx.save();
    rrect(ctx, fL, fT, SW, mainH, R);
    ctx.strokeStyle = 'rgba(0,0,0,.10)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  // ── SLAB sliding off (top layer being cut) ──
  if (slabH > 1 && slicePct < 1) {
    const ox  = slicePct * 60;
    const oy  = slicePct * 22;
    const sT  = fT - slabH;
    const sB  = fT;
    const R2  = Math.min(16, SW * 0.06, slabH * 0.45);

    ctx.save();
    ctx.translate(ox, oy);

    // Slab right side
    ctx.beginPath();
    ctx.moveTo(fR,         sB);
    ctx.lineTo(fR+DEPTH_X, sB+DEPTH_Y);
    ctx.lineTo(fR+DEPTH_X, sT+DEPTH_Y);
    ctx.lineTo(fR,         sT);
    ctx.closePath();
    ctx.fillStyle = theme.sideR;
    ctx.fill();

    // Slab top face
    ctx.beginPath();
    ctx.moveTo(fL,         sT);
    ctx.lineTo(fR,         sT);
    ctx.lineTo(fR+DEPTH_X, sT+DEPTH_Y);
    ctx.lineTo(fL+DEPTH_X, sT+DEPTH_Y);
    ctx.closePath();
    ctx.fillStyle = theme.topH;
    ctx.fill();

    // Slab front face
    rrect(ctx, fL, sT, SW, slabH, R2);
    const sfg = ctx.createLinearGradient(0, sT, 0, sB);
    sfg.addColorStop(0, theme.topH);
    sfg.addColorStop(1, theme.side);
    ctx.fillStyle = sfg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.07)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  // Progress bar
  const pct = Math.max(0, (remaining * SH_UNIT - slicePct * SH_UNIT) / FULL_H);
  document.getElementById('bar').style.width = (pct * 100) + '%';
}

// Rounded rect path helper
function rrect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);   ctx.quadraticCurveTo(x+w, y,   x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);   ctx.quadraticCurveTo(x,   y+h, x,   y+h-r);
  ctx.lineTo(x, y+r);     ctx.quadraticCurveTo(x,   y,   x+r, y);
  ctx.closePath();
}

// Pseudo-random helper
function pr(seed) {
  const x = Math.sin(seed+1)*10000;
  return x - Math.floor(x);
}

// ═══════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════
function getXY(e) {
  return e.touches
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
    : { x: e.clientX,            y: e.clientY };
}

function hitSoap(x, y) {
  const remaining = TOTAL_LAYERS - layersDone;
  const mainH = remaining * SH_UNIT - slicePct * SH_UNIT;
  const slabH = slicePct * SH_UNIT;
  const fB = CY + mainH / 2;
  const fT = fB - mainH - slabH;
  return x > CX - SW/2 - 30
      && x < CX + SW/2 + DEPTH_X + 30
      && y > fT - 30
      && y < fB + 30;
}

canvas.addEventListener('mousedown', e => {
  initAudio();
  const p = getXY(e);
  if (hitSoap(p.x, p.y)) { active = true; lastX = p.x; }
});
document.addEventListener('mousemove', e => {
  const p = getXY(e);
  moveKnife(p.x, p.y);
  if (active && canCut) doCut(p.x, p.y);
});
document.addEventListener('mouseup', () => active = false);

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  const p = getXY(e);
  if (hitSoap(p.x, p.y)) { active = true; lastX = p.x; }
}, { passive: false });
document.addEventListener('touchmove', e => {
  e.preventDefault();
  const p = getXY(e);
  moveKnife(p.x, p.y);
  if (active && canCut) doCut(p.x, p.y);
}, { passive: false });
document.addEventListener('touchend', () => active = false);
document.addEventListener('mouseleave', () => {
  active = false;
  knifeWrap.style.display = 'none';
});

function moveKnife(x, y) {
  knifeWrap.style.display = 'block';
  knifeWrap.style.left = (x - 175) + 'px';
  knifeWrap.style.top  = (y - 18)  + 'px';
}

function doCut(x, y) {
  const dx = Math.abs(x - lastX);
  if (dx < 1.5) return;
  lastX = x;

  slicePct = Math.min(1, slicePct + dx * 0.0075);

  // Sound every 3rd tick
  sndTick++;
  if (sndTick % 3 === 0) playScrape();

  // Chunk at knife tip
  if (Math.random() < 0.5) spawnChunk(x, y, false);

  if (slicePct >= 1) finishLayer(x, y);
}
